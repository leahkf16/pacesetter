function merge(a,b){
if(!b||typeof b!=='object')return a;
for(const k of Object.keys(b)){
if(['__proto__','constructor','prototype'].includes(k))continue;
if(b[k]&&typeof b[k]==='object'&&!Array.isArray(b[k])&&a[k]&&typeof a[k]==='object'&&!Array.isArray(a[k]))
a[k]=merge(a[k],b[k]);
else a[k]=b[k];
}
return a;
}

const TRAINING_LIBRARY = {
  strength: [
    {name:'Push-ups',sets:3,reps:'Max controlled reps'},
    {name:'Bodyweight squats',sets:3,reps:'15'},
    {name:'Plank',sets:3,reps:'45 seconds'},
    {name:'Glute bridges',sets:3,reps:'15'},
    {name:'Dead bugs',sets:3,reps:'12 per side'}
  ],
  run: [
    {name:'Dynamic warm-up',sets:1,reps:'5 minutes'},
    {name:'Running session',sets:1,reps:'Follow today’s running goal'},
    {name:'Walking recovery',sets:1,reps:'5 minutes'},
    {name:'Calf stretches',sets:2,reps:'30 seconds per side'}
  ]
};

function dateKey(date=new Date()){
  const y=date.getFullYear();
  const m=String(date.getMonth()+1).padStart(2,'0');
  const d=String(date.getDate()).padStart(2,'0');
  return `${y}-${m}-${d}`;
}

function dayIndex(date=new Date()){
  return (date.getDay()+6)%7;
}

function getTrainingDay(date=new Date()){
  const index=dayIndex(date);
  return TRAINING_DAYS[index]||null;
}

function getTodayExercises(){
  const plan=getTrainingDay();
  if(!plan)return [];
  return TRAINING_LIBRARY[plan.kind]||[];
}

function workoutKey(date=dateKey()){
  return `daily-${date}`;
}

function workoutRecord(date=dateKey()){
  const key=workoutKey(date);
  const value=state.workouts?.[key];

  if(value&&typeof value==='object'){
    return value;
  }

  return {
    completed:false,
    exercises:{},
    completedAt:null
  };
}

function exerciseCompleted(index,date=dateKey()){
  return Boolean(
    workoutRecord(date).exercises?.[String(index)]
  );
}

function setExerciseCompleted(index,checked){
  if(state.role!=='athlete')return;

  const key=workoutKey();
  const record=workoutRecord();

  record.exercises=record.exercises||{};
  record.exercises[String(index)]=Boolean(checked);

  const exercises=getTodayExercises();

  record.completed=exercises.length>0&&
    exercises.every((_,i)=>record.exercises[String(i)]);

  record.completedAt=record.completed
    ?new Date().toISOString()
    :null;

  state.workouts[key]=record;

  queueSync();
  render();
}

function finishWorkout(){
  if(state.role!=='athlete')return;

  const key=workoutKey();
  const record=workoutRecord();
  const exercises=getTodayExercises();

  record.exercises={};

  exercises.forEach((_,i)=>{
    record.exercises[String(i)]=true;
  });

  record.completed=true;
  record.completedAt=new Date().toISOString();

  state.workouts[key]=record;

  queueSync();
  render();
}

function completedWorkoutDates(data=state){
  const records=data.workouts||{};

  return Object.entries(records)
    .filter(([key,value])=>
      key.startsWith('daily-')&&
      value&&
      typeof value==='object'&&
      value.completed===true
    )
    .map(([key])=>key.replace('daily-',''))
    .sort();
}

function completedWorkoutCount(data=state){
  return completedWorkoutDates(data).length;
}

function workoutStreak(data=state){
  const dates=new Set(completedWorkoutDates(data));

  let cursor=new Date();
  cursor.setHours(12,0,0,0);

  if(!dates.has(dateKey(cursor))){
    cursor.setDate(cursor.getDate()-1);
  }

  let streak=0;

  while(dates.has(dateKey(cursor))){
    streak++;
    cursor.setDate(cursor.getDate()-1);
  }

  return streak;
}

function workoutsThisWeek(data=state){
  const dates=completedWorkoutDates(data);

  const now=new Date();
  const monday=new Date(now);
  monday.setDate(now.getDate()-dayIndex(now));

  const start=dateKey(monday);

  return dates.filter(d=>d>=start&&d<=dateKey(now)).length;
}

function formatSeconds(value){
  const seconds=Math.max(0,Math.round(Number(value)||0));

  return `${Math.floor(seconds/60)}:${String(
    seconds%60
  ).padStart(2,'0')}`;
}

function parseRunTime(value){
  if(typeof value==='number'&&Number.isFinite(value)){
    return Math.max(0,Math.round(value));
  }

  const text=String(value||'').trim();

  if(!text)return null;

  if(text.includes(':')){
    const parts=text.split(':').map(Number);

    if(parts.length!==2||
       parts.some(n=>!Number.isFinite(n))||
       parts[1]<0||
       parts[1]>=60){
      return null;
    }

    return Math.round(parts[0]*60+parts[1]);
  }

  const n=Number(text);

  return Number.isFinite(n)&&n>=0
    ?Math.round(n)
    :null;
}

function latestScore(data=state){
  const scores=data.scores||[];

  return scores.length
    ?scores[scores.length-1]
    :null;
}

function bestRunTime(data=state){
  const times=(data.scores||[])
    .map(s=>Number(s.run))
    .filter(n=>Number.isFinite(n)&&n>0);

  return times.length?Math.min(...times):null;
}

function bestPushups(data=state){
  const values=(data.scores||[])
    .map(s=>Number(s.push))
    .filter(n=>Number.isFinite(n)&&n>=0);

  return values.length?Math.max(...values):null;
}

function bestSitups(data=state){
  const values=(data.scores||[])
    .map(s=>Number(s.sit))
    .filter(n=>Number.isFinite(n)&&n>=0);

  return values.length?Math.max(...values):null;
}

  if(state.role!=='athlete')return;

  const push=Number(el('ptPush')?.value);
  const sit=Number(el('ptSit')?.value);
  const run=parseRunTime(el('ptRun')?.value);

  if(!Number.isFinite(push)||
     !Number.isFinite(sit)||
     push<0||
     sit<0||
     !Number.isInteger(push)||
     !Number.isInteger(sit)||
     run===null||
     run<=0){
    alert('Enter valid push-ups, sit-ups, and a run time such as 17:30.');
    return;
  }

  state.scores=state.scores||[];

  state.scores.push({
    id:crypto.randomUUID(),
    date:dateKey(),
    push,
    sit,
    run,
    createdAt:new Date().toISOString()
  });

  queueSync();
  render();
}

function deletePTScore(id){
  if(state.role!=='athlete')return;

  if(!confirm('Delete this PT practice result?'))return;

  state.scores=(state.scores||[])
    .filter(s=>s.id!==id);

  queueSync();
  render();
}

function runImprovement(data=state){
  const scores=(data.scores||[])
    .filter(s=>Number(s.run)>0);

  if(scores.length<2)return null;

  const first=Number(scores[0].run);
  const latest=Number(scores[scores.length-1].run);

  return first-latest;
}

function ptReadiness(data=state){
  const latest=latestScore(data);

  if(!latest){
    return {
      label:'No practice result yet',
      progress:0,
      remaining:null
    };
  }

  const goal=Number(data.runGoal)||1020;
  const current=Number(latest.run)||0;

  if(current<=0){
    return {
      label:'Run time unavailable',
      progress:0,
      remaining:null
    };
  }

  const difference=current-goal;

  if(difference<=0){
    return {
      label:'Personal run target reached',
      progress:100,
      remaining:0
    };
  }

  const progress=Math.max(
    0,
    Math.min(99,Math.round(goal/current*100))
  );

  return {
    label:`${formatSeconds(difference)} from personal run target`,
    progress,
    remaining:difference
  };
}

/*
 PT readiness is a personal training indicator,
 NOT an official USAF PT score or pass prediction.
 Official scoring depends on current standards,
 age, sex, approved components and test rules.
*/

function setRunGoal(){
  if(state.role!=='athlete')return;

  const value=parseRunTime(el('runGoalInput')?.value);

  if(value===null||value<=0){
    alert('Enter a valid target time, such as 16:30.');
    return;
  }

  state.runGoal=value;
  queueSync();
  render();
}

function waterToday(data=state){
  return Number(data.water?.[dateKey()]||0);
}

function addWater(amount){
  if(state.role!=='athlete')return;

  const key=dateKey();

  state.water=state.water||{};
  state.water[key]=Math.max(
    0,
    Number(state.water[key]||0)+Number(amount||0)
  );

  queueSync();
  render();
}

function setWaterGoal(){
  if(state.role!=='athlete')return;

  const value=Number(el('waterGoalInput')?.value);

  if(!Number.isFinite(value)||value<250||value>10000){
    alert('Enter a daily water goal between 250 and 10,000 mL.');
    return;
  }

  state.waterGoalMl=Math.round(value);

  queueSync();
  render();
}

function waterProgress(data=state){
  const goal=Number(data.waterGoalMl)||2500;

  return Math.max(
    0,
    Math.min(100,Math.round(waterToday(data)/goal*100))
  );
}

function hydrationDays(data=state){
  const goal=Number(data.waterGoalMl)||2500;

  return Object.values(data.water||{})
    .filter(v=>Number(v)>=goal).length;
}

function calculateLocalAchievements(data=state){
  const achievements=[];
  const workouts=completedWorkoutCount(data);
  const streak=workoutStreak(data);
  const pt=(data.scores||[]).length;

  if(workouts>=1){
    achievements.push({
      id:'first-workout',
      icon:'🏁',
      title:'First Workout',
      description:'Completed the first training session.'
    });
  }

  if(workouts>=10){
    achievements.push({
      id:'ten-workouts',
      icon:'🏆',
      title:'10 Workouts Strong',
      description:'Completed ten training sessions.'
    });
  }

  if(workouts>=25){
    achievements.push({
      id:'twenty-five-workouts',
      icon:'💪',
      title:'Consistency Champion',
      description:'Completed twenty-five training sessions.'
    });
  }

  if(streak>=7){
    achievements.push({
      id:'seven-day-streak',
      icon:'🔥',
      title:'Seven-Day Streak',
      description:'Completed seven consecutive daily sessions.'
    });
  }

  if(pt>=1){
    achievements.push({
      id:'first-pt',
      icon:'🎯',
      title:'PT Baseline',
      description:'Recorded the first PT practice result.'
    });
  }

  if(pt>=5){
    achievements.push({
      id:'five-pt',
      icon:'📈',
      title:'Progress Tracker',
      description:'Recorded five PT practice results.'
    });
  }

  if(hydrationDays(data)>=7){
    achievements.push({
      id:'hydration-week',
      icon:'💧',
      title:'Hydration Hero',
      description:'Reached the daily water goal seven times.'
    });
  }

  if(ptReadiness(data).remaining===0){
    achievements.push({
      id:'run-goal',
      icon:'🥇',
      title:'Run Goal Reached',
      description:'Reached the personal run-time target.'
    });
  }

  return achievements;
}

function trainingAnalytics(data=state){
  const workouts=completedWorkoutCount(data);
  const thisWeek=workoutsThisWeek(data);
  const streak=workoutStreak(data);
  const scores=data.scores||[];

  return {
    totalWorkouts:workouts,
    workoutsThisWeek:thisWeek,
    weeklyCompletionPercent:Math.round(thisWeek/6*100),
    streak,
    ptSessions:scores.length,
    bestRun:bestRunTime(data),
    bestPush:bestPushups(data),
    bestSit:bestSitups(data),
    runImprovement:runImprovement(data),
    achievements:calculateLocalAchievements(data)
  };
}

function formatDate(value){
  if(!value)return 'Not scheduled';

  const d=new Date(`${value}T12:00:00`);

  return Number.isNaN(d.getTime())
    ?String(value)
    :d.toLocaleDateString('en-US',{
      month:'short',
      day:'numeric',
      year:'numeric'
    });
}

function progressBar(percent){
  const value=Math.max(
    0,
    Math.min(100,Number(percent)||0)
  );

  return `<div class="bar">
    <div class="fill" style="width:${value}%"></div>
  </div>`;
}

function friendlyError(error){
  if(!error)return 'Unknown error';

  if(error.code==='42P01'){
    return 'The training tables have not been created in Supabase yet. Run the upgrade SQL first.';
  }

  if(error.code==='42501'){
    return 'Supabase denied permission. Check the database access policies and Coach–Athlete link.';
  }

  return error.message||String(error);
}

function showTrainingError(error){
  console.error('PACESETTER training error:',error);
  alert(friendlyError(error));
}

function sortNewest(items,key='created_at'){
  return [...(items||[])].sort((a,b)=>
    String(b[key]||'').localeCompare(
      String(a[key]||'')
    )
  );
}

function formatTimestamp(value){
  if(!value)return '';

  const date=new Date(value);

  if(Number.isNaN(date.getTime())){
    return String(value);
  }

  return date.toLocaleString('en-US',{
    month:'short',
    day:'numeric',
    hour:'numeric',
    minute:'2-digit'
  });
}

async function createWorkoutAssignment(){
  if(!canCoach()){
    alert('Link an Athlete account before assigning workouts.');
    return;
  }

  const title=(el('assignmentTitle')?.value||'').trim();
  const date=el('assignmentDate')?.value||dateKey();
  const details=(el('assignmentDetails')?.value||'').trim();

  if(!title){
    alert('Enter a workout title.');
    return;
  }

  if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){
    alert('Choose a valid workout date.');
    return;
  }

    alert('Please shorten the workout title or instructions.');

      .from(TRAINING_TABLES.assignments)

  const assignment=assignments.find(a=>a.id===id);

  if(assignment.athlete_id!==currentUser.id){
    alert('This workout does not belong to your account.');

      .from(TRAINING_TABLES.assignments)

      .eq('id',id)

function assignmentStats(){
  const completed=assignments.filter(a=>
    a.status==='completed'
  ).length;

  const total=assignments.length;

  const overdue=assignments.filter(a=>
    a.status!=='completed'&&
    a.scheduled_date<dateKey()
  ).length;

  const upcoming=assignments.filter(a=>
    a.status!=='completed'&&
    a.scheduled_date>=dateKey()
  ).length;

  return {
    total,
    completed,
    overdue,
    upcoming,
    completionPercent:total
      ?Math.round(completed/total*100)
      :0
  };
}

function cloudPTAnalytics(){
  const validRuns=ptResults
    .map(r=>Number(r.run_seconds))
    .filter(v=>Number.isFinite(v)&&v>0);

  const pushes=ptResults
    .map(r=>Number(r.pushups))
    .filter(Number.isFinite);

  const sits=ptResults
    .map(r=>Number(r.situps))
    .filter(Number.isFinite);

  return {
    sessions:ptResults.length,
    bestRun:validRuns.length
      ?Math.min(...validRuns)
      :null,
    bestPush:pushes.length
      ?Math.max(...pushes)
      :null,
    bestSit:sits.length
      ?Math.max(...sits)
      :null
  };
}

/* --------------------------------

   -------------------------------- */

function stopTrainingRealtime(){
  if(trainingChannel&&client){
    client.removeChannel(trainingChannel);
  }

  trainingChannel=null;
}

function startTrainingRealtime(){
  stopTrainingRealtime();

  if(!cloudReady())return;

  const athleteId=trainingAthleteId();

  if(!athleteId)return;

  trainingChannel=client
    .channel(`pacesetter-training-${athleteId}`)
    .on(
      'postgres_changes',
      {
        event:'*',
        schema:'public',
        table:TRAINING_TABLES.assignments,
        filter:`athlete_id=eq.${athleteId}`
      },
      ()=>refreshTrainingData()
    )
    .on(
      'postgres_changes',
      {
        event:'*',
        schema:'public',
        table:TRAINING_TABLES.pt,
        filter:`athlete_id=eq.${athleteId}`
      },
      ()=>refreshTrainingData()
    )
    .on(
      'postgres_changes',
      {
        event:'*',
        schema:'public',
        table:TRAINING_TABLES.awards,
        filter:`athlete_id=eq.${athleteId}`
      },
      ()=>refreshTrainingData()
    )
    .subscribe(status=>{
      if(status==='CHANNEL_ERROR'){
        console.warn('Realtime disconnected. Two-minute sync remains available.');
      }
    });
}

async function refreshTrainingData(){
  if(trainingRefreshBusy||!cloudReady())return;

  trainingRefreshBusy=true;

  try{
    await Promise.all([
      refreshAssignments(),
      refreshPTResults(),
      refreshAwards()
    ]);

    render();
  }catch(error){
    console.warn(
      'Training refresh failed:',
      friendlyError(error)
    );
  }finally{
    trainingRefreshBusy=false;
  }
}

async function initializeTrainingFeatures(){
  if(!cloudReady())return;

  try{
    await refreshTrainingData();
    startTrainingRealtime();
  }catch(error){
    console.warn(
      'Training features unavailable:',
      friendlyError(error)
    );
  }
}

/* --------------------------------
   iPHONE NOTIFICATION FOUNDATION
   -------------------------------- */

/*
 Supabase Realtime supports live in-app updates.

 Actual iPhone push notifications require:
 1. A secure HTTPS-installed web app.
 2. A service worker with push handling.
 3. User notification permission.
 4. A push subscription stored securely.
 5. A trusted server or Edge Function to send
    Web Push messages.

 This part does not claim to provide background
 push notifications. Those require additional
 files and server-side configuration.
*/

function iphoneNotificationSupported(){
  return Boolean(
    'Notification' in window&&
    'serviceWorker' in navigator&&
    'PushManager' in window
  );
}

function notificationAvailabilityText(){
  if(!iphoneNotificationSupported()){
    return 'Background push notifications are not available in this browser.';
  }

  if(Notification.permission==='granted'){
    return 'Notification permission granted. Push delivery still requires server setup.';
  }

  if(Notification.permission==='denied'){
    return 'Notifications are blocked in iPhone settings.';
  }

  return 'Background push notifications are not configured yet.';
}

async function requestNotificationPermission(){
  if(!iphoneNotificationSupported()){
    alert('Install PACESETTER on your iPhone Home Screen to check notification support.');
    return;
  }

  try{
    const permission=await Notification.requestPermission();

    if(permission==='granted'){
      alert('Permission granted. Background push delivery requires additional setup.');
    }else{
      alert('Notification permission: '+permission);
    }
  }catch(error){
    alert('Notification permission failed: '+error.message);
  }
}

/* --------------------------------
   LOAD PRIVATE LOVE NOTES
   -------------------------------- */

async function refreshLoveNotes(){
  if(!cloudReady()){
    loveNotes=[];
    return;
  }

  const athleteId=lovePartnerId();

  if(!athleteId){
    loveNotes=[];
    return;
  }

  try{
    const {data,error}=await client
      .from('pacesetter_love_notes')
      .select(
        'id,athlete_id,sender_id,recipient_id,body,created_at,read_at'
      )
      .eq('athlete_id',athleteId)
      .order('created_at',{
        ascending:false
      })
      .limit(100);

    if(error)throw error;

    loveNotes=data||[];
    loveError='';

    const unread=loveNotes
      .filter(m=>
        m.recipient_id===currentUser.id&&!m.read_at
      )
      .map(m=>m.id);

    if(unread.length){
      const {error:readError}=await client
        .from('pacesetter_love_notes')
        .update({
          read_at:new Date().toISOString()
        })
        .in('id',unread)
        .eq('recipient_id',currentUser.id);

      if(readError){
        console.warn(
          'Love Notes read receipt:',
          readError.message
        );
      }
    }
  }catch(error){
    loveError=
      'Love Notes could not be loaded: '+
      error.message;

    console.warn(error);
  }
}

/* --------------------------------
   SEND LOVE NOTES
   -------------------------------- */

async function sendLoveNote(message){
  if(loveBusy||!cloudReady()){
    alert('Please sign in first.');
    return;
  }

  const athleteId=lovePartnerId();

  if(!athleteId){
    alert('Connect the Athlete account first.');
    return;
  }

  const body=String(
    message??el('loveMessage')?.value??''
  ).trim();

  if(!body||body.length>1500){
    alert('Write a message of up to 1,500 characters.');
    return;
  }

  loveBusy=true;

  try{
    let recipientId;

    if(state.role==='coach'){
      recipientId=athleteId;
    }else{
      const {data:links,error:lookupError}=await client
        .from('pacesetter_coach_access')
        .select('coach_id')
        .eq('athlete_id',currentUser.id)
        .limit(1);

      if(lookupError)throw lookupError;

      recipientId=links?.[0]?.coach_id;

      if(!recipientId){
        throw Error(
          'No Coach is linked to your account yet.'
        );
      }
    }

    const {error}=await client
      .from('pacesetter_love_notes')
      .insert({
        athlete_id:athleteId,
        sender_id:currentUser.id,
        recipient_id:recipientId,
        body
      });

    if(error)throw error;

    await refreshLoveNotes();
    render();
  }catch(error){
    alert(
      'Could not send Love Note: '+error.message
    );
  }finally{
    loveBusy=false;
  }
}

function sendQuickLove(){
  const message=state.role==='coach'
    ?'Sending you all my love ❤️'
    :'Sending you love back, baby ❤️';

  return sendLoveNote(message);
}

/* ================================================
   PART 8 — NAVIGATION, RENDERING & APP STARTUP
   ================================================ */

const APP_TABS=[
  {id:'home',icon:'🏠',label:'Home'},
  {id:'training',icon:'💪',label:'Training'},
  {id:'pt',icon:'🎯',label:'PT'},
  {id:'progress',icon:'📊',label:'Progress'},
  {id:'love',icon:'💌',label:'Love'},
  {id:'settings',icon:'⚙️',label:'Settings'}
];

let renderScheduled=false;
let appStarted=false;

function navigate(tab){
  const valid=APP_TABS.some(item=>item.id===tab);

  state.tab=valid?tab:'home';
  save();

  render();

  window.scrollTo({
    top:0,
    behavior:'smooth'
  });
}

function renderNavigation(){
  const nav=el('nav');
  if(!nav)return;

  nav.innerHTML=APP_TABS.map(item=>`
    <button
      type="button"
      class="${state.tab===item.id?'active':''}"
      onclick="navigate('${item.id}')"
      aria-label="${esc(item.label)}"
      aria-current="${state.tab===item.id?'page':'false'}">
      <span>${item.icon}</span>
      ${esc(item.label)}
    </button>
  `).join('');
}

function renderAthleteScreen(){
  switch(state.tab){
    case 'training':
      return renderAthleteTraining();

    case 'pt':
      return renderAthletePT();

    case 'progress':
      return renderAthleteProgress();

    case 'love':
      return renderLoveNotesScreen();

    case 'settings':
      return renderAthleteSettings();

    case 'home':
    default:
      return renderAthleteHome();
  }
}

function renderCoachScreen(){
  switch(state.tab){
    case 'training':
      return renderCoachTraining();

    case 'pt':
      return renderCoachPT();

    case 'progress':
      return renderCoachProgress();

    case 'love':
      return renderLoveNotesScreen();

    case 'settings':
      return renderCoachSettings();

    case 'home':
    default:
      return renderCoachHome();
  }
}

function render(){
  const app=el('app');
  if(!app)return;

  try{
    const coach=state.role==='coach';

    const modeButton=el('modeBtn');

    if(modeButton){
      modeButton.textContent=coach
        ?'💚 Coach'
        :'🏃 Athlete';
    }

    app.innerHTML=coach
      ?renderCoachScreen()
      :renderAthleteScreen();

    renderNavigation();

  }catch(error){
    console.error(
      'PACESETTER render error:',
      error
    );

    app.innerHTML=`
      <div class="card">
        <h2>Something went wrong</h2>
        <p class="muted">
          PACESETTER could not load this screen.
          Your locally saved training data has
          not been intentionally deleted.
        </p>

        <p class="notice">
          ${esc(error.message)}
        </p>

        <button class="btn"
          onclick="state.tab='home';save();render()">
          Return Home
        </button>
      </div>
    `;

    renderNavigation();
  }
}

function scheduleRender(){
  if(renderScheduled)return;

  renderScheduled=true;

  requestAnimationFrame(()=>{
    renderScheduled=false;
    render();
  });
}

   ACCOUNT AND ROLE REFRESH
   -------------------------------- */

async function refreshCurrentRole(){
  if(!cloudReady())return;

  try{
    if(state.role==='coach'){
      await refreshCoach();
    }else{
      await loadOwnProfile();
    }

    await refreshTrainingData();
    await refreshLoveNotes();

    startTrainingRealtime();

    scheduleRender();
  }catch(error){
    console.warn(
      'Role refresh failed:',
      error.message
    );
  }
}

/*
 Wrap the earlier role-switch function so that
 training data refreshes when the user switches
 between Coach and Athlete views.
*/

const originalToggleRole=toggleRole;

toggleRole=function(){
  stopTrainingRealtime();

  assignments=[];
  ptResults=[];
  coachAwards=[];
  loveNotes=[];

  originalToggleRole();

  if(cloudReady()){
    refreshCurrentRole();
  }
};

/* --------------------------------
   CLOUD SESSION STARTUP
   -------------------------------- */

async function startPacesetter(){
  if(appStarted)return;

  appStarted=true;

  render();

  if(!initCloud()){
    console.warn(
      'Supabase unavailable. Local features remain accessible.'
    );
    return;
  }

  try{
    await restoreCloud();

    if(cloudReady()){
      await initializeTrainingFeatures();
      await refreshLoveNotes();
    }

    render();

  }catch(error){
    console.error(
      'PACESETTER startup failed:',
      error
    );

    render();
  }
}

   EXTEND AUTOMATIC SYNC
   -------------------------------- */

const originalSyncNowSilent=syncNowSilent;

syncNowSilent=async function(){
  await originalSyncNowSilent();

  if(cloudReady()){
    try{
      await refreshTrainingData();
      await refreshLoveNotes();
      scheduleRender();
    }catch(error){
      console.warn(
        'Extended automatic sync:',
        error.message
      );
    }
  }
};

/* --------------------------------
   RESTORE WHEN APP RETURNS TO VIEW
   -------------------------------- */

window.addEventListener('focus',()=>{
  if(cloudReady()){
    syncNowSilent();
  }
});

window.addEventListener('online',()=>{
  if(cloudReady()){
    syncNowSilent();
  }
});

/* --------------------------------
   SAFETY: CLEAN UP ON SIGN OUT
   -------------------------------- */

const originalSignOut=signOut;

signOut=async function(){
  stopTrainingRealtime();

  await originalSignOut();

  assignments=[];
  ptResults=[];
  coachAwards=[];
  loveNotes=[];

  render();
};

/* --------------------------------
   START THE APP
   -------------------------------- */

if(document.readyState==='loading'){
  document.addEventListener(
    'DOMContentLoaded',
    startPacesetter,
    {once:true}
  );
}else{
  startPacesetter();
}

    breathing: 'Take comfortable, steady breaths.',
    avoid: 'Do not abruptly stop and sit down immediately after a very hard effort unless symptoms require you to stop safely.',
    easier: 'Walk at whatever comfortable pace you need.',
    video: 'https://www.youtube.com/watch?v=WxKq8548p94'
  },

  'Calf stretches': {
    setup: 'Stand facing a wall with both hands resting against it for balance.',
    steps: [
      'Step one foot behind you.',
      'Keep the back heel on the floor and the back knee straight.',
      'Bend the front knee and gently lean toward the wall.',
      'Stop when you feel a mild stretch in the back calf.',
      'Hold for approximately 30 seconds without bouncing.',
      'Switch legs and repeat.'
    ],
    breathing: 'Breathe slowly and normally.',
    avoid: 'Do not bounce or push into sharp pain.',
    easier: 'Shorten your stance or reduce how far you lean.',
    video: 'https://www.acefitness.org/resources/everyone/exercise-library/'
  }
};

const PACE_SKIP_ROASTS = [
  'Oh, so the couch made the training schedule? — Leah',
  'Your future personal record would like a word.',
  'Leah loves you, but the running shoes have questions.',
  'Your girlfriend made you a whole training app and you chose the couch? Bold.',
  'Leah can’t do the push-ups for you, handsome. Neither can your excuses.',
  'Your running shoes are officially filing a missing-person report.',
  'Your girlfriend built you an entire training app, and you’re speedrunning the Skip button. Impressive.',
  'Even the stopwatch is disappointed, and it literally has no feelings.',
  'Plot twist: the couch just set a personal record for your attention.'
];

const PACE_WATER_JOKES = [
  'Look at you drinking water like a responsible adult. Leah is impressed. 💚',
  'Your kidneys would like to thank you for your service.',
  'Hydrated and handsome? Pick a struggle.',
  'Another sip? Okay, Aquaman. I see you.',
  'Your water bottle finally has a purpose besides decoration.',
  'Leah said drink water, not become a raisin.',
  'Breaking news: local man remembers water exists.',
  'Your muscles called. They appreciate the delivery.',
  'You are one sip closer to being Leah’s favorite hydrated person.',
  'Water logged. The girlfriend approval rating is rising.'
];

function paceRandom(items){
  return items[Math.floor(Math.random()*items.length)];
}

let paceWaterReaction='';

function paceExerciseGuide(name){
  const guide=PACE_EXERCISE_GUIDES[name];

  if(!guide){
    return `<p class="muted">
      Follow the prescribed sets and repetitions,
      move with control, and stop if you feel pain.
    </p>`;
  }

  return `
    <details style="margin-top:9px">
      <summary>📖 How do I do this?</summary>

      <div style="padding:12px 0">
        <strong>Starting position</strong>
        <p class="muted">${esc(guide.setup)}</p>

        <strong>Step-by-step instructions</strong>
        <ol style="padding-left:22px;line-height:1.7">
          ${guide.steps.map(step=>`
            <li style="margin-bottom:6px">
              ${esc(step)}
            </li>
          `).join('')}
        </ol>

        <strong>How to breathe</strong>
        <p class="muted">${esc(guide.breathing)}</p>

        <strong>Common mistakes</strong>
        <p class="muted">${esc(guide.avoid)}</p>

        <strong>Easier option</strong>
        <p class="muted">${esc(guide.easier)}</p>

        <a class="btn alt"
           href="${esc(guide.video)}"
           target="_blank"
           rel="noopener noreferrer"
           style="
             display:inline-block;
             text-decoration:none;
             margin-top:12px">
          ▶ Watch / View Demonstration
        </a>

        <p class="muted" style="font-size:11px">
          Opens an external exercise demonstration
          or exercise library.
        </p>
      </div>
    </details>`;
}

function paceSkipWorkout(){
  if(state.role!=='athlete')return;

  const reason=prompt(
    'Why are you skipping today?\n\n' +
    'Enter: busy, motivation, sick, injured, exhausted, or other.',
    'busy'
  );

  if(reason===null)return;

  const normalized=reason.trim().toLowerCase()||'other';

  const recoveryReason=
    /sick|injur|exhaust|pain|recover|fatigue|unwell/.test(normalized);

  const message=recoveryReason
    ?'Recovery counts. Take care of yourself; Leah wants you healthy. ❤️'
    :paceRandom(PACE_SKIP_ROASTS);

  const key=workoutKey();
  const record=workoutRecord();

  record.skipped=true;
  record.completed=false;
  record.completedAt=null;
  record.skipReason=normalized;
  record.skipMessage=message;
  record.skippedAt=new Date().toISOString();

  state.workouts[key]=record;

  queueSync();
  render();
}

function paceUndoSkip(){
  const key=workoutKey();
  const record=workoutRecord();

  delete record.skipped;
  delete record.skipReason;
  delete record.skipMessage;
  delete record.skippedAt;

  state.workouts[key]=record;

  queueSync();
  render();
}

const paceOriginalFinishWorkout=finishWorkout;

finishWorkout=function(){
  if(workoutRecord().skipped){
    alert('Undo your skipped workout before completing it.');
    return;
  }

  paceOriginalFinishWorkout();
};

const paceOriginalSetExerciseCompleted=setExerciseCompleted;

setExerciseCompleted=function(index,checked){
  if(workoutRecord().skipped){
    alert('Undo your skipped workout first.');
    return;
  }

  paceOriginalSetExerciseCompleted(index,checked);
};

/* REPLACE DAILY WORKOUT DISPLAY */

renderDailyWorkout=function(){
  const plan=getTrainingDay();
  const exercises=getTodayExercises();

  if(!plan){
    return `<div class="card accent">
      <h3>🌿 Recovery Day</h3>
      <p class="muted">
        Rest is part of training. Recover, hydrate,
        and come back ready for your next session.
      </p>
    </div>`;
  }

  const record=workoutRecord();

  if(record.skipped){
    return `<div class="card gold">
      <h3>↷ Workout Skipped</h3>

      <p style="
        font-size:18px;
        font-weight:750;
        line-height:1.5">
        ${esc(record.skipMessage||'Workout skipped.')}
      </p>

      <p class="muted">
        Reason: ${esc(record.skipReason||'Not specified')}
      </p>

      <p class="muted">
        This workout is recorded as skipped,
        not completed.
      </p>

      <button class="btn"
        onclick="paceUndoSkip()">
        Never Mind, I'm Doing It 💪
      </button>
    </div>`;
  }

  const done=exercises.filter((_,i)=>
    exerciseCompleted(i)
  ).length;

  const progress=exercises.length
    ?Math.round(done/exercises.length*100)
    :0;

  return `<div class="card">
    <div class="flex">
      <div>
        <div class="eyebrow" style="color:#56816b">
          TODAY'S TRAINING
        </div>
        <h3>${esc(plan.theme)}</h3>
      </div>

      <span class="chip">
        ${done}/${exercises.length}
      </span>
    </div>

    ${progressBar(progress)}

    <p class="muted">
      Tap "How do I do this?" beneath any exercise
      for detailed instructions and a demonstration.
    </p>

    ${exercises.map((exercise,i)=>`
      <div class="exercise">
        <div class="row" style="flex-wrap:nowrap">
          <input
            class="check"
            type="checkbox"
            style="width:22px;flex:none"
            ${exerciseCompleted(i)?'checked':''}
            onchange="setExerciseCompleted(${i},this.checked)"
          >

          <div style="flex:1;min-width:0">
            <strong>${esc(exercise.name)}</strong>

            <div class="muted">
              ${esc(exercise.sets)} set(s) ·
              ${esc(exercise.reps)}
            </div>

            ${paceExerciseGuide(exercise.name)}
          </div>
        </div>
      </div>
    `).join('')}

    <button class="btn"
      style="width:100%;margin-top:15px"
      onclick="finishWorkout()">
      ${record.completed
        ?'✓ Workout Completed'
        :'✓ Mark Entire Workout Complete'}
    </button>

    ${!record.completed?`
      <button class="btn alt"
        style="
          width:100%;
          margin-top:10px;
          border:1px solid #e2cbb8"
        onclick="paceSkipWorkout()">
        ↷ Skip Workout (Leah Will Have Questions)
      </button>
    `:''}
  </div>`;
};

/* HYDRATION JOKES AND 32-OZ BOTTLE */

const paceOriginalAddWater=addWater;

addWater=function(amount){
  const before=waterToday();

  paceOriginalAddWater(amount);

  const after=waterToday();

  if(after>before){
    paceWaterReaction=paceRandom(PACE_WATER_JOKES);
  }else if(after<before){
    paceWaterReaction='Water entry corrected. Even legends make mistakes.';
  }

  render();
};

renderHydration=function(){
  const amount=waterToday();
  const goal=Number(state.waterGoalMl)||2500;
  const progress=waterProgress();

  return `${sectionHeading(
    '💧 Hydration Station',
    'Because apparently Leah has to remind you to drink water.'
  )}

  <div class="card blue">
    <div class="flex">
      <div>
        <div style="font-size:27px;font-weight:850">
          ${amount.toLocaleString()} mL
        </div>

        <div class="muted">
          of ${goal.toLocaleString()} mL daily goal
        </div>
      </div>

      <span class="chip">${progress}%</span>
    </div>

    ${progressBar(progress)}

    ${paceWaterReaction?`
      <div class="card gold"
        style="margin:15px 0;padding:15px">
        <strong>💚 Leah Says:</strong>

        <p style="
          font-size:15px;
          line-height:1.5;
          margin-bottom:0">
          ${esc(paceWaterReaction)}
        </p>
      </div>
    `:''}

    <div class="row" style="margin-top:14px">
      <button class="btn alt"
        onclick="addWater(250)">
        +1 cup of water
      </button>

      <button class="btn alt"
        onclick="addWater(500)">
        +1 bottle of water
      </button>

      <button class="btn"
        onclick="addWater(946)">
        +Your Normal Bottle
      </button>

      <button class="btn alt"
        onclick="addWater(-250)">
        +1 cup of juice
      </button>
    </div>

    <details>
      <summary>Change daily water goal</summary>

      <label for="waterGoalInput">
        Daily water goal (mL)
      </label>

      <input id="waterGoalInput"
        type="number"
        min="250"
        max="10000"
        value="${goal}">

      <button class="btn"
        style="margin-top:10px"
        onclick="setWaterGoal()">
        Save Water Goal
      </button>
    </details>

    <p class="muted" style="
      font-size:11px;
      margin-top:15px">
      This is a personal tracking goal, not a
      prescribed hydration requirement. Adjust
      fluid intake to your needs and conditions.
    </p>
  </div>`;
};

</script>
