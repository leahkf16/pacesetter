t-align:center;padding:30px 12px;color:#6b8176}@media(min-width:700px){.metricgrid{grid-template-columns:repeat(4,1fr)}.brand{font-size:30px}main{padding:22px 25px 120px}.hero h1{font-size:36px}}
 .track{height:11px;background:#dce9e1;border-radius:20px;overflow:hidden;margin-top:10px} .tabs{overflow-x:auto} </style></head><body><header><div class="top"><div class="headrow"><div><div class="eyebrow">THE TRAINING CLUB</div><div class="brand">PACESETTER<span style="color:#e6c37e">.</span></div><div class="tagline">Train with purpose. Beat your best.</div></div><button class="pill" id="modeBtn" onclick="toggleRole()">🏃 Athlete</button></div></div></header><main id="app"></main><nav class="tabs" id="nav"></nav><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
'use strict';
const KEY='pacesetter-v5'; const DAY=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];const GOALS={push:63,sit:56,run:1080,pacer:70};
const INITIAL={name:'Athlete',coachName:'Coach',testDate:'',birthday:'1999-12-04',testHistory:[],runGoal:1020,focus:'run',ageBand:'auto',baseline:{push:48,sit:56,run:1200,pacer:0},scores:[],workouts:{},fatigue:{},water:{},waterGoalMl:2500,role:'athlete',tab:'home',created:new Date().toISOString().slice(0,10),coachNotes:'',session:{},sync:{url:'',key:'',email:'',linked:false},coachLink:''};
let state=load(),client=null,sessionUser=null,cloudReady=false,selectedWeek=null,timerInterval=null,timerLeft=0,timerRunning=false;function load(){try{return merge(structuredClone(INITIAL),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch{return structuredClone(INITIAL)}}function merge(a,b){for(const k in b){if(b[k]&&typeof b[k]==='object'&&!Array.isArray(b[k])&&a[k]&&typeof a[k]==='object'&&!Array.isArray(a[k]))a[k]=merge(a[k],b[k]);else a[k]=b[k]}return a}function save(){localStorage.setItem(KEY,JSON.stringify(state));}function el(id){return document.getElementById(id)}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function n(v){return Math.max(0,Number(v)||0)}function mm(s){return `${Math.floor(s/60)}:${String(Math.round(s%60)).padStart(2,'0')}`}function parseTime(s){if(/^\d{1,3}:\d{2}$/.test(s)){let [m,z]=s.split(':').map(Number);return z<60?m*60+z:null}return null}function iso(d){let a=new Date(d);return Number.isNaN(+a)?'':a.toISOString().slice(0,10)}function dayDiff(a,b){return Math.round((new Date(a+'T12:00:00')-new Date(b+'T12:00:00'))/86400000)}function today(){return new Date().toLocaleDateString('en-CA')}function daysLeft(){return state.testDate?dayDiff(state.testDate,today()):null}function trainingWeek(){return Math.max(1,Math.floor(dayDiff(today(),state.created)/7)+1)}function weekNum(){return selectedWeek||trainingWeek()}function progress(v,g,inverse=false){return Math.max(0,Math.min(100,Math.round((inverse?g/Math.max(1,v):v/g)*100)))}function latest(){return state.scores[0]||{...state.baseline,date:state.created}}function status(){const l=daysLeft();return l!==null&&l<=7?'taper':l!==null&&l<=14?'peak':'build'}function readiness(){let s=latest();let g=ageGoals();return [{name:'Push-ups',value:s.push,target:g.push,unit:'reps',pct:progress(s.push,g.push)},{name:'Sit-ups',value:s.sit,target:g.sit,unit:'reps',pct:progress(s.sit,g.sit)},{name:'2-mile run',value:mm(s.run),target:mm(state.runGoal),unit:'',pct:progress(s.run,state.runGoal,true)},{name:'PACER',value:s.pacer,target:g.pacer,unit:'shuttles',pct:progress(s.pacer,g.pacer)}]}
const AGE_BANDS=['Under 25','25-29','30-34','35-39','40-44','45-49','50-54','55-59','60+'];
// Maximum-point thresholds for male categories, transcribed from uploaded USAF PFRA tables, effective 1 Mar 2026.
const MAX_POINTS={push:[67,63,60,56,52,49,45,42,38],sit:[58,56,54,52,50,48,46,44,42],run:[805,815,822,836,845,870,909,928,1018],pacer:[87,85,84,82,81,77,71,69,65]};
function currentAge(on=today()){const d=new Date(on+'T12:00:00'),b=new Date((state.birthday||'1999-12-04')+'T12:00:00');let a=d.getFullYear()-b.getFullYear();if(d.getMonth()<b.getMonth()||(d.getMonth()===b.getMonth()&&d.getDate()<b.getDate()))a--;return a}function ageBandForAge(a){return a<25?'Under 25':a>=60?'60+':AGE_BANDS[Math.min(7,Math.floor((a-25)/5))+1]}function ageGoals(){let band=state.ageBand==='auto'?ageBandForAge(currentAge(state.testDate||today())):state.ageBand;let i=Math.max(0,AGE_BANDS.indexOf(band));return {push:MAX_POINTS.push[i],sit:MAX_POINTS.sit[i],pacer:MAX_POINTS.pacer[i],run:MAX_POINTS.run[i]}}
const MOTIVATION=[['Consistency beats intensity when intensity cannot be sustained.','Training note'],['I can do all things through Christ which strengtheneth me.','Philippians 4:13 · KJV'],['Leah loves you. Keep going.','A note from Leah'],['But they that wait upon the LORD shall renew their strength.','Isaiah 40:31 · KJV'],['You have already proved you can pass. Now build a better performance.','Training note'],['Leah is proud of you — even on the hard days.','A note from Leah'],['Let us not be weary in well doing.','Galatians 6:9 · KJV'],['One steady mile at a time.','Training note']];
function birthdayCard(){let d=new Date(),b=state.birthday||'1999-12-04';return (d.getMonth()+1===Number(b.slice(5,7))&&d.getDate()===Number(b.slice(8,10)))?`<div class="card gold" style="border:2px solid #b9985c"><div class="eyebrow" style="color:#725528">A LITTLE SOMETHING FROM LEAH</div><h2>Happy Birthday! 🎂</h2><p>Another year of becoming stronger, wiser, and more you. I'm proud of you. Leah loves you, always. ❤️</p><p class="muted">This message comes back every December 4.</p></div>`:''}function motivationCard(){let d=Math.floor(Date.now()/86400000),m=MOTIVATION[d%MOTIVATION.length];return `<div class="card gold" style="border-left:5px solid #bc9253"><div class="eyebrow" style="color:#816233">TODAY'S ENCOURAGEMENT</div><h3 style="margin-top:9px">“${m[0]}”</h3><div class="muted">${m[1]}</div></div>`}
function workout(week,idx){let scores=latest(),phase=status(),f=Math.max(state.fatigue[`${week}-${idx}`]||0,state.fatigue[`${week-1}-${idx}`]||0),low=phase==='taper'||f>=4;let scale=phase==='taper'?.55:f>=4?.7:1;let run=scores.run||1200;let easyPace=Math.round(run/2+75);let tempoPace=Math.round(run/2+20);let intervalPace=Math.round(run/2-8);let push=Math.max(5,Math.round((scores.push||20)*.52*scale)),sit=Math.max(5,Math.round((scores.sit||20)*.52*scale));let increment=Math.min(4,Math.floor((week-1)/2));let min=(v)=>Math.max(1,Math.round(v*scale));let p=(v)=>Math.max(3,Math.round(v*scale));let day=DAY[idx],runInfo='',items=[],theme='',kind='';let wave=(week-1)%3;
if(idx===0){theme='Upper-body strength + push-up capacity';kind='strength';items=[['Push-ups',`${min(4)} sets × ${push} reps`,'60–90 sec'],['Dumbbell bench press',`${min(3)} × 8–12`,'75 sec'],['Single-arm dumbbell row',`${min(3)} × 10 each side`,'60 sec'],['Overhead press',`${min(3)} × 10`,'60 sec'],['Triceps extensions',`${min(3)} × 12`,'45 sec'],['Plank',`${min(3)} × 40 sec`,'30 sec']];runInfo=`Easy aerobic jog ${p(15+Math.min(12,increment*3))} min (optional). Conversational pace, ~${mm(easyPace)}/mile or slower.`}
if(idx===1){theme='Speed intervals + core';kind='speed';items=[['Test-form sit-ups',`${min(4)} × ${sit}`,'60 sec'],['Dead bugs',`${min(3)} × 10 per side`,'30 sec'],['Reverse crunch',`${min(3)} × 12`,'30 sec'],['Side plank',`${min(3)} × 30 sec per side`,'30 sec']];runInfo=wave===0?`${min(4+increment)} × 400 m at ~${mm(intervalPace/4)} per 400 m; 2 min walk/jog recovery.`:wave===1?`${min(5+increment)} × 300 m at strong controlled effort; 90 sec recovery.`:`${min(6+increment)} × 200 m at brisk but relaxed pace; 75 sec recovery.`;runInfo+=' Warm up 10 min, cool down 5 min. Never sprint all-out.'}
if(idx===2){theme='Lower-body muscle + agility';kind='strength';items=[['Goblet squat',`${min(3)} × 10–12`,'75 sec'],['Reverse lunge',`${min(3)} × 10 per leg`,'60 sec'],['Romanian deadlift',`${min(3)} × 10`,'75 sec'],['Step-ups',`${min(3)} × 10 per leg`,'60 sec'],['Calf raises',`${min(3)} × 18`,'30 sec']];runInfo=`20 m shuttle technique: ${min(3)} rounds × ${p(6+increment)} lengths, 90 sec between rounds. Smooth turns, not maximal speed.`}
if(idx===3){theme='Tempo endurance + muscular stamina';kind='tempo';items=[['Push-ups',`${min(3)} × ${Math.max(4,Math.round(push*.8))}`,'60 sec'],['Test-form sit-ups',`${min(3)} × ${Math.max(4,Math.round(sit*.8))}`,'60 sec'],['Bird dogs',`${min(3)} × 10 per side`,'30 sec'],['Plank shoulder taps',`${min(3)} × 16`,'30 sec']];runInfo=wave===0?`Tempo: 8 min easy + ${p(10+increment*2)} min steady at ~${mm(tempoPace)}/mile + 5 min easy.`:wave===1?`Progression run: ${p(20+increment*3)} min, starting easy and finishing steady.`:`Fartlek: ${min(5+increment)} × 2 min quicker / 2 min easy, plus warm-up and cool-down.`}
if(idx===4){theme='Endurance run + weekly reflection';kind='endurance';items=[['Mobility flow',`${min(2)} × 5 min`,'—'],['Light push-up technique',`${min(2)} × ${Math.max(4,Math.round(push*.6))}`,'60 sec'],['Light sit-up technique',`${min(2)} × ${Math.max(4,Math.round(sit*.6))}`,'60 sec']];runInfo=`Easy endurance ${p(22+Math.min(20,increment*5))} min at conversational effort. If needed, alternate 4 min jog / 1 min walk. Every 2–3 weeks, replace with a controlled benchmark (not an all-out test).`}
if(idx===5){theme='PT skills + active recovery';kind='technique';items=[['Test-form push-ups',`${min(2)} × ${Math.max(5,Math.round(push*.65))}`,'75 sec'],['Test-form sit-ups',`${min(2)} × ${Math.max(5,Math.round(sit*.65))}`,'75 sec'],['Mobility flow','10–15 min','—']];runInfo=wave===0?'Easy 15–20 minute jog and 4 relaxed 20-second strides, with full recovery.':wave===1?'Easy 20-minute walk-jog or low-impact bike; keep breathing comfortable.':'Controlled PT technique practice: short easy jog, no maximal timed test today.';}
if(low)runInfo=`Recovery adjustment: ${phase==='taper'?'Test-week taper':'High-fatigue modification'}. `+runInfo+' Keep the effort comfortable and reduce volume; prioritize sleep.';
return {day,theme,kind,runInfo,items,phase,week};}
function changeTab(t){state.tab=t;save();render()}function toggleRole(){state.role=state.role==='athlete'?'coach':'athlete';state.tab='home';save();render()}function render(){el('modeBtn').textContent=state.role==='athlete'?'🏃 Athlete':'📋 Coach';const tabs=state.role==='athlete'?[['home','⌂','Home'],['train','▦','Train'],['scores','◫','Scores'],['water','◉','Water'],['settings','⚙','Settings']]:[['home','⌂','Coach'],['roster','◎','Athlete'],['settings','⚙','Settings']];el('nav').innerHTML=tabs.map(([id,ico,name])=>`<button class="${state.tab===id?'active':''}" onclick="changeTab('${id}')"><span>${ico}</span>${name}</button>`).join('');el('app').innerHTML=state.role==='coach'?coachView():({home:homeView,train:trainView,scores:scoresView,water:waterView,settings:settingsView}[state.tab]||homeView)();}
function homeView(){let left=daysLeft(),r=readiness(),idx=(new Date().getDay()+6)%7,isSunday=idx===6,w=isSunday?null:workout(trainingWeek(),idx),complete=Object.keys(state.workouts).filter(k=>state.workouts[k]?.done).length;return `${birthdayCard()}${motivationCard()}${waterMini()}<div class="hero"><div class="eyebrow">YOUR NEXT PERSONAL BEST</div><h1>Stronger. Faster.<br>Better than last time.</h1><p>Welcome back, ${esc(state.name)}. ${left===null?'Set your test date to activate your countdown.':left>=0?`${left} days until test day. ${status()==='taper'?'Time to taper and recover.':'Keep stacking good sessions.'}`:'Your scheduled test date has passed. Set a new date to begin another cycle.'}</p><button class="btn goldbtn" onclick="changeTab('${left===null?'settings':'train'}')">${left===null?'Set test date':'Open today’s workout'} →</button></div><div class="metricgrid"><div class="metric"><small>TEST COUNTDOWN</small><div class="big">${left===null?'—':Math.max(0,left)}</div><small>days remaining</small></div><div class="metric"><small>TRAINING WEEK</small><div class="big">${trainingWeek()}</div><small>${status()==='taper'?'Recovery week':status()==='peak'?'Sharpening phase':'Building phase'}</small></div><div class="metric"><small>WORKOUTS DONE</small><div class="big">${complete}</div><small>logged sessions</small></div><div class="metric"><small>RUN GOAL</small><div class="big">${mm(state.runGoal)}</div><small>2-mile stretch goal</small></div></div><h2>Today's game plan</h2><div class="card accent"><div class="eyebrow" style="color:#527b63">${isSunday?'SUNDAY · RECOVERY':esc(w.day.toUpperCase())}</div><h3>${isSunday?'Rest is part of the plan':esc(w.theme)}</h3><p class="muted">${isSunday?'No scheduled workout. Recover, hydrate, and enjoy your day.':esc(w.runInfo)}</p>${isSunday?'':`<button class="btn" onclick="changeTab('train')">View workout →</button>`}</div><h2>PT score targets</h2><div class="card">${r.map(x=>`<div style="margin:0 0 17px"><div class="flex"><b>${x.name}</b><span class="small">${x.value} / ${x.target}</span></div><div class="bar"><div class="fill" style="width:${x.pct}%"></div></div></div>`).join('')}<p class="muted">Passing targets are based on the standards you provided. Verify official test rules and technique.</p></div>${syncNotice()}`}
function syncNotice(){return cloudReady?`<div class="card blue"><b>☁ Cloud connected</b><p class="muted">Changes can be synced with your coach. Use Sync now after editing.</p><button class="btn alt" onclick="syncNow()">Sync now</button></div>`:`<div class="card gold"><b>Local mode</b><p class="muted">Your progress is saved on this device. For a live coach dashboard on another phone, set up cloud sync in Settings.</p></div>`}
function trainView(){let wk=weekNum();return `<div class="flex"><h2>Training plan</h2><span class="chip">Week ${wk}</span></div><div class="card"><div class="flex"><button class="btn alt" onclick="selectedWeek=Math.max(1,weekNum()-1);render()">← Prior</button><b>Week ${wk}</b><button class="btn alt" onclick="selectedWeek=weekNum()+1;render()">Next →</button></div><p class="muted">Sessions vary by week, baseline score, test countdown, and reported fatigue. A benchmark is recommended every 2–3 weeks.</p><div class="weekgrid">${DAY.map((d,i)=>`<button class="day ${state.workouts[`${wk}-${i}`]?.done?'on':''}" onclick="document.getElementById('work${i}').scrollIntoView({behavior:'smooth'})">${d.slice(0,3)}<strong>${state.workouts[`${wk}-${i}`]?.done?'✓':state.workouts[`${wk}-${i}`]?.skipped?'↷':i+1}</strong></button>`).join('')}</div></div>${DAY.map((d,i)=>workCard(wk,i)).join('')}<div class="card gold"><b>Sunday · Rest day</b><p class="muted">Recovery is scheduled. No skipping or guilt required.</p></div><div class="notice">Training is an adaptive template, not medical supervision. Increase gradually, keep easy runs easy, and stop for chest pain, dizziness, or unusual symptoms. The final 7 days reduce volume to preserve freshness.</div>`}
const DEMOS={'Push-ups':'Hands under shoulders, rigid torso, lower to the test-required depth, then press up without sagging.','Test-form sit-ups':'Use the exact permitted hand placement, foot support, and elbow/knee contact required by the test.','Goblet squat':'Hold one dumbbell close to chest, sit between hips, keep heels down, stand tall.','Reverse lunge':'Step backward, lower both knees with control, push through front foot.','Romanian deadlift':'Soft knees, hinge hips backward, keep back neutral and weights near legs.','Step-ups':'Plant whole foot on platform and stand without bouncing off the back leg.','Plank':'Elbows beneath shoulders, ribs tucked, hold a straight body line.','Dead bugs':'Keep lower back gently against floor while extending opposite arm and leg.','Dumbbell bench press':'Shoulder blades stable, lower weights under control, press without bouncing.','Single-arm dumbbell row':'Support torso, pull elbow toward hip without rotating trunk.','Overhead press':'Brace abdomen, press overhead without arching lower back.','Triceps extensions':'Keep upper arms relatively still, straighten elbows slowly.','Reverse crunch':'Curl pelvis off floor gently rather than swinging legs.','Side plank':'Stack shoulders and hips, maintain a straight line.','Calf raises':'Rise fully onto toes, pause briefly, lower under control.','Bird dogs':'Extend opposite arm and leg while keeping hips level.','Plank shoulder taps':'Tap opposite shoulder with minimal hip sway.','Mobility flow':'Use gentle ankle, hip, thoracic spine and shoulder movements.','Light push-up technique':'Smooth, controlled repetitions well short of failure.','Light sit-up technique':'Practice the official test movement with relaxed rhythm.'};
function workCard(wk,i){let w=workout(wk,i),id=`${wk}-${i}`,rec=state.workouts[id]||{},checked=rec.checked||{},count=Object.values(checked).filter(Boolean).length;return `<div class="card" id="work${i}"><div class="flex"><div><span class="chip">${w.day}</span><span class="chip">${w.kind}</span><h3>${w.theme}</h3></div><span class="chip">${rec.done?'✓ Done':rec.skipped?'↷ Skipped':`${count}/${w.items.length+1}`}</span></div><div class="card blue" style="margin:12px 0"><b>🏃 Running session</b><p class="muted">${esc(w.runInfo)}</p><label class="row"><input class="check" type="checkbox" ${checked.run?'checked':''} onchange="mark('${id}','run',this.checked)"> Completed run</label></div>${w.items.map((x,j)=>`<div class="exercise"><div class="row" style="flex-wrap:nowrap"><input aria-label="Mark ${esc(x[0])} complete" class="check" type="checkbox" ${checked[j]?'checked':''} onchange="mark('${id}','${j}',this.checked)"><div style="flex:1"><b>${esc(x[0])}</b><div class="muted">${esc(x[1])} · Rest ${esc(x[2])}</div></div><button class="btn alt tiny" onclick="startTimer(${parseInt(x[2])||60})">⏱</button></div><details><summary>How to do it</summary><p class="muted">${esc(DEMOS[x[0]]||'Move with control, use a comfortable range, and stop before form breaks down.')}</p></details></div>`).join('')}<label>How hard did today feel? (1 = easy, 5 = exhausted)</label><select onchange="setFatigue('${id}',this.value)"><option value="0">Choose after training</option>${[1,2,3,4,5].map(x=>`<option value="${x}" ${state.fatigue[id]==x?'selected':''}>${x} / 5</option>`).join('')}</select><div style="height:10px"></div>${rec.skipPending?`<div class="card gold"><b>Oh, we're skipping? 🤨</b><p>${esc(rec.skipMessage)}</p><div class="flex" style="gap:8px;flex-wrap:wrap"><button class="btn" onclick="undoSkip('${id}')">Never mind, I'm working out 💪</button><button class="btn alt" onclick="confirmSkip('${id}')">Nah, I'm still skipping 🙃</button></div></div>`:rec.skipped?`<div class="card gold"><b>Skipped · ${esc(rec.skipReason||'No reason')}</b><p>${esc(rec.skipMessage||'Tomorrow is another chance.')}</p><button class="btn alt" onclick="undoSkip('${id}')">Never mind, I'm working out 💪</button></div>`:''}${!rec.skipped&&!rec.skipPending?`<button class="btn alt" onclick="skipWorkout('${id}')">Skip workout 🙃</button>`:''} <button class="btn" onclick="finish('${id}')">${rec.done?'Update completed workout':'Finish & save workout'}</button></div>`}
function skipWorkout(id){let reason=prompt('Why skip today? Enter: busy, motivation, sick, injured, exhausted, or other.','busy');if(reason===null)return;reason=reason.trim().toLowerCase()||'other';let rest=/sick|injur|exhaust|pain|recovery|fatigue/.test(reason);let jokes=['Oh, so the couch made the training schedule? — Leah','Your future personal record would like a word.','Leah loves you, but the running shoes have questions.','Your girlfriend made you a whole training app and you chose the couch? Bold.'];let rec=state.workouts[id]||{checked:{}};rec.skipPending=true;rec.skipped=false;rec.skipReason=reason;rec.skipIsRest=rest;rec.skipMessage=rest?'Recovery counts. Take care of yourself; Leah wants you healthy.':jokes[Math.floor(Math.random()*jokes.length)];state.workouts[id]=rec;save();render()}
function confirmSkip(id){let rec=state.workouts[id];if(!rec)return;let finalJokes=['Leah can’t do the push-ups for you, handsome. Neither can your excuses.','Your running shoes are officially filing a missing-person report.','Your girlfriend built you an entire training app, and you’re speedrunning the Skip button. Impressive.','Even the stopwatch is disappointed, and it literally has no feelings.','Plot twist: the couch just set a personal record for your attention.'];rec.skipped=true;rec.skipPending=false;rec.done=false;rec.skipMessage=rec.skipIsRest?'Rest is training too. Get well and come back strong. Leah loves you.':finalJokes[Math.floor(Math.random()*finalJokes.length)];rec.skippedAt=new Date().toISOString();delete rec.skipIsRest;state.workouts[id]=rec;save();queueSync();render()}
function undoSkip(id){let rec=state.workouts[id];if(!rec)return;delete rec.skipped;delete rec.skipPending;delete rec.skipIsRest;delete rec.skipReason;delete rec.skipMessage;delete rec.skippedAt;save();queueSync();render();alert('That’s the energy! Leah knew you had it in you. 💚')}
function mark(id,k,v){let rec=state.workouts[id]||{checked:{}};rec.checked[k]=v;state.workouts[id]=rec;save();}function setFatigue(id,v){state.fatigue[id]=n(v);save()}function finish(id){let rec=state.workouts[id]||{checked:{}};rec.done=true;rec.skipped=false;rec.finishedAt=new Date().toISOString();state.workouts[id]=rec;save();queueSync();render();}
function startTimer(s){clearInterval(timerInterval);timerLeft=s;timerRunning=false;let overlay=document.createElement('div');overlay.id='timerOverlay';overlay.style='position:fixed;inset:0;background:#0c2925e8;z-index:20;display:flex;align-items:center;justify-content:center;padding:20px';overlay.innerHTML=`<div class="card" style="width:min(380px,100%);text-align:center"><div class="eyebrow" style="color:#507b61">REST TIMER</div><div class="timer" id="timeDisplay">${mm(s)}</div><div class="row" style="justify-content:center"><button class="btn" id="timerToggle" onclick="toggleTimer()">Start</button><button class="btn alt" onclick="resetTimer(${s})">Reset</button><button class="btn alt" onclick="closeTimer()">Close</button></div></div>`;document.body.appendChild(overlay)}function toggleTimer(){timerRunning=!timerRunning;el('timerToggle').textContent=timerRunning?'Pause':'Resume';clearInterval(timerInterval);if(timerRunning)timerInterval=setInterval(()=>{timerLeft=Math.max(0,timerLeft-1);if(el('timeDisplay'))el('timeDisplay').textContent=mm(timerLeft);if(!timerLeft){clearInterval(timerInterval);timerRunning=false;if(el('timerToggle'))el('timerToggle').textContent='Done ✓';if(navigator.vibrate)navigator.vibrate([150,100,150])}},1000)}function resetTimer(s){clearInterval(timerInterval);timerLeft=s;timerRunning=false;el('timeDisplay').textContent=mm(s);el('timerToggle').textContent='Start'}function closeTimer(){clearInterval(timerInterval);el('timerOverlay')?.remove()}
function scoresView(){let rows=readiness();return `<h2>Performance lab</h2><div class="card accent"><b>Beat the standard. Then beat your best.</b><p class="muted">Log actual 60-second reps, 2-mile time, and PACER shuttle count. You can enter either running test or both.</p><div class="formgrid"><div><label>Push-ups / 60 sec</label><input id="scorePush" type="number" min="0" placeholder="e.g. 45"></div><div><label>Sit-ups / 60 sec</label><input id="scoreSit" type="number" min="0" placeholder="e.g. 42"></div><div><label>2-mile (MM:SS)</label><input id="scoreRun" placeholder="e.g. 19:15"></div><div><label>PACER shuttles</label><input id="scorePacer" type="number" min="0" placeholder="e.g. 60"></div></div><label>Test date</label><input id="scoreDate" type="date" value="${today()}"><p><button class="btn" onclick="addScore()">Save performance</button></p></div><h2>Current vs standard</h2><div class="metricgrid">${rows.map(r=>`<div class="metric"><small>${r.name}</small><div class="big">${r.value}</div><small>Target: ${r.target}</small><div class="bar"><div class="fill" style="width:${r.pct}%"></div></div></div>`).join('')}</div><h2>Progress history</h2><div class="card">${state.scores.length?state.scores.slice(0,15).map(s=>`<div class="history"><b>${esc(s.date)}</b><div class="muted">${s.push} push-ups · ${s.sit} sit-ups · ${mm(s.run)} run · ${s.pacer} shuttles</div></div>`).join(''):'<div class="empty">No test results yet. Log a baseline to start your progress history.</div>'}</div><button class="btn alt" onclick="exportCSV()">Export progress CSV ↓</button>`}
function addScore(){let p=el('scorePush').value,si=el('scoreSit').value,r=el('scoreRun').value,pa=el('scorePacer').value;let prev=latest(),seconds=r.trim()?parseTime(r.trim()):prev.run;if(seconds===null||seconds<60||seconds>7200){alert('Enter a valid run time like 18:45');return}let s={date:el('scoreDate').value||today(),push:p===''?prev.push:n(p),sit:si===''?prev.sit:n(si),run:seconds,pacer:pa===''?prev.pacer:n(pa)};state.scores.unshift(s);state.scores.sort((a,b)=>b.date.localeCompare(a.date));save();queueSync();render()}function exportCSV(){let rows=['date,pushups,situps,run_seconds,pacer',...state.scores.map(s=>[s.date,s.push,s.sit,s.run,s.pacer].join(','))];let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([rows.join('\n')],{type:'text/csv'}));a.download='pacesetter-scores.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
function settingsView(){return `<h2>Make it yours</h2><div class="card"><label>Athlete name</label><input id="name" value="${esc(state.name)}"><label>USAF age bracket</label><select id="ageBand"><option value="auto" ${state.ageBand==='auto'?'selected':''}>Automatic from birthday (recommended)</option>${AGE_BANDS.map(a=>`<option value="${a}" ${state.ageBand===a?'selected':''}>${a}</option>`).join('')}</select><label>Birthday</label><input id="birthday" type="date" value="${esc(state.birthday||'1999-12-04')}"><label>Next PT test date (change whenever scheduled)</label><input id="testDate" type="date" value="${esc(state.testDate)}"><label>2-mile stretch goal (MM:SS)</label><input id="runGoal" value="${mm(state.runGoal)}"><label>Current 2-mile baseline (MM:SS)</label><input id="baselineRun" value="${mm(state.baseline.run)}"><p class="muted">Starting values are estimates from past performance (48 push-ups, 56 sit-ups, 20:00 run); verify with a baseline test. Age-specific maximum-point reference is from the March 2026 USAF charts; the personal run goal is not a pass/fail calculation. Use the Scores tab to log new benchmarks. Training paces adapt to the latest recorded 2-mile time.</p><button class="btn" onclick="saveSettings()">Save goals</button></div><div class="card"><h3>PT test history</h3><p class="muted">After each test, archive the date and results, then schedule the next one. Old tests stay in your history.</p><button class="btn alt" onclick="archiveTest()">Archive current PT test</button>${(state.testHistory||[]).map(t=>`<div class="history"><b>${esc(t.date)}</b><div class="muted">Push-ups ${t.push} · Sit-ups ${t.sit} · 2-mile ${mm(t.run)} · PACER ${t.pacer}</div></div>`).join('')||'<p class="muted">No past tests archived yet.</p>'}</div>${cloudSettings()}<div class="card"><b>Data & privacy</b><p class="muted">Without cloud sync, data stays in this browser. Clearing browser storage can erase it. Use the CSV export for backups. When cloud sync is enabled, your linked coach can see your shared training records.</p></div>`}
function saveSettings(){let goal=parseTime(el('runGoal').value),base=parseTime(el('baselineRun').value);if(!goal||!base){alert('Enter times as MM:SS');return}state.name=el('name').value.trim()||'Athlete';state.ageBand=el('ageBand').value;state.birthday=el('birthday').value||'1999-12-04';state.testDate=el('testDate').value;state.runGoal=goal;state.baseline.run=base;save();queueSync();render()}
function archiveTest(){if(!state.testDate){alert('Set a PT test date first.');return}if((state.testHistory||[]).some(t=>t.date===state.testDate)){alert('This test date is already archived.');return}if(!confirm('Archive this PT test using the latest recorded scores? You can update the next test date afterward.'))return;state.testHistory=state.testHistory||[];state.testHistory.unshift({date:state.testDate,...latest()});state.testHistory[0].date=state.testDate;state.testDate='';save();queueSync();render()}function coachView(){if(state.tab==='settings')return coachSettings();let rows=readiness(),complete=Object.entries(state.workouts).filter(([k,v])=>v.done).length;return `${birthdayCard()}${motivationCard()}${waterCoachMini()}<div class="hero"><div class="eyebrow">YOUR COACH CORNER</div><h1>Lead the progress.<br>Celebrate the wins.</h1><p>${esc(state.name)} · ${cloudReady?'Cloud sync available':'Demo data on this device — connect cloud for two-phone viewing.'}</p><button class="btn goldbtn" onclick="changeTab('settings')">${cloudReady?'Cloud controls':'Connect athlete account'} →</button></div><div class="metricgrid"><div class="metric"><small>SESSIONS DONE</small><div class="big">${complete}</div><small>recorded workouts</small></div><div class="metric"><small>RUN TIME</small><div class="big">${mm(latest().run)}</div><small>2 miles</small></div><div class="metric"><small>TEST IN</small><div class="big">${daysLeft()===null?'—':Math.max(0,daysLeft())}</div><small>days</small></div><div class="metric"><small>WEEK</small><div class="big">${trainingWeek()}</div><small>${status()} phase</small></div></div><h2>Readiness snapshot</h2><div class="card">${rows.map(x=>`<div style="margin:0 0 16px"><div class="flex"><b>${x.name}</b><span class="small">${x.value} / ${x.target}</span></div><div class="bar"><div class="fill" style="width:${x.pct}%"></div></div></div>`).join('')}</div><h2>Recent training</h2><div class="card">${Object.entries(state.workouts).filter(([k,v])=>v.done).sort((a,b)=>(b[1].finishedAt||'').localeCompare(a[1].finishedAt||'')).slice(0,8).map(([k,v])=>`<div class="history"><b>Week ${k.split('-')[0]} · ${DAY[Number(k.split('-')[1])]||'Workout'}</b><div class="muted">Completed ${esc((v.finishedAt||'').slice(0,10))} · Fatigue ${state.fatigue[k]||'not recorded'}/5</div></div>`).join('')||'<p class="muted">No completed workouts yet.</p>'}</div><h2>Coach note</h2><div class="card"><label>Encouragement or training guidance</label><input id="coachNotes" value="${esc(state.coachNotes)}" placeholder="Keep your easy runs easy!"><p><button class="btn" onclick="state.coachNotes=el('coachNotes').value;save();queueSync();render()">Save coach note</button></p></div>${syncNotice()}`}
function coachSettings(){return `<h2>Coach connection</h2><div class="card"><b>View his progress from your phone</b><p class="muted">Use the same Supabase project configuration on both phones. Each person signs in with their own email. The athlete shares their six-character invitation code; the coach joins with that code.</p></div>${cloudSettings()}<div class="card"><label>Athlete invitation code</label><input id="inviteCode" placeholder="e.g. K7X2PQ" value="${esc(state.coachLink)}"><button class="btn" style="margin-top:12px" onclick="joinAthlete()">Link athlete</button></div>`}
function cloudSettings(){return `<div class="card"><h3>☁ Optional live cloud sync</h3><p class="muted">Requires your own Supabase project and the included SQL setup. Use the project URL and public anon key only. Never put a service-role key in the app.</p><label>Supabase project URL</label><input id="cloudUrl" value="${esc(state.sync.url)}" placeholder="https://your-project.supabase.co"><label>Public anon key</label><input id="cloudKey" value="${esc(state.sync.key)}" placeholder="sb_publishable_..."><label>Your email</label><input id="cloudEmail" type="email" value="${esc(state.sync.email)}" placeholder="you@example.com"><label>Password</label><input id="cloudPassword" type="password" placeholder="At least 8 characters"><div class="row" style="margin-top:13px"><button class="btn" onclick="authCloud('signup')">Create account</button><button class="btn alt" onclick="authCloud('signin')">Sign in</button><button class="btn alt" onclick="syncNow()">Sync now</button></div><p class="muted" id="cloudStatus">${cloudReady?'Signed in and ready.':'Not signed in.'}</p>${state.role==='athlete'?`<p><button class="btn alt" onclick="createInvite()">Generate coach invite code</button></p><p class="muted" id="inviteResult"></p>`:''}</div>`}
function waterToday(){return Math.max(0,Number((state.water||{})[today()]||0))}
function juiceToday(){return Math.max(0,Number((state.juice||{})[today()]||0))}
function totalFluidToday(){return waterToday()+juiceToday()}
function waterGoal(){return Math.max(500,Math.min(6000,Number(state.waterGoalMl)||2500))}
function challengeWater(){return Math.max(0,waterToday()-juiceToday())}
function waterPct(){return Math.min(100,Math.round(100*challengeWater()/waterGoal()))}
function oz(ml){return (Number(ml)/29.5735295625).toFixed(1)}
function waterMini(){return `<div class="card blue"><div class="flex"><div><b>💧 Today's water challenge</b><p class="muted">${oz(challengeWater())} oz challenge credit / ${oz(waterGoal())} oz goal · ${waterPct()}%</p><p class="muted">Actually drank: ${oz(waterToday())} oz water · ${oz(juiceToday())} oz juice. Juice creates a playful 1:1 water-credit penalty, not real dehydration.</p></div><button class="btn alt" onclick="changeTab('water')">Track drinks →</button></div><div class="track"><div class="fill" style="width:${waterPct()}%"></div></div></div>`}
function waterCoachMini(){return `<div class="card blue"><b>💧 Athlete hydration · ${esc(today())}</b><p>${oz(challengeWater())} oz water challenge credit / ${oz(waterGoal())} oz target (${waterPct()}%)</p><p class="muted">Actual intake: ${oz(waterToday())} oz water · ${oz(juiceToday())} oz juice. Juice penalty is only a game. Updates after cloud sync is configured.</p></div>`}
function waterView(){let dates=[...new Set([...Object.keys(state.water||{}),...Object.keys(state.juice||{})])].sort((a,b)=>b.localeCompare(a)).slice(0,7);return `<h2>💧 Hydration station</h2><div class="hero"><div class="eyebrow">FUEL THE WORK</div><h1>${oz(challengeWater())} <small style="font-size:16px">oz water challenge credit</small></h1><p>Actually drank: ${oz(waterToday())} oz water · ${oz(juiceToday())} oz juice</p><p>Juice penalty: −${oz(juiceToday())} oz water challenge credit · ${waterPct()}% of ${oz(waterGoal())} oz goal</p><div class="track" style="background:#477469"><div class="fill" style="width:${waterPct()}%;background:#e3ba6c"></div></div></div><div class="card"><h3>Quick add</h3><div class="formgrid"><button class="btn alt" onclick="addWaterOz(32)">💧 My everyday bottle · +32 oz</button><button class="btn alt" onclick="addWaterOz(16)">💧 Plastic water bottle · +16 oz</button><button class="btn alt" onclick="addWaterOz(16)">🥤 Solo cup of water · +16 oz</button><button class="btn alt" onclick="addJuiceOz(16)">🧃 Solo cup of juice · −16 oz challenge credit</button></div><label>Custom water amount (oz)</label><div class="flex"><input id="customWater" type="number" inputmode="decimal" min="0.5" max="67" step="0.5" placeholder="e.g. 20"><button class="btn" onclick="addCustomWater()">Add water</button></div><p><button class="btn alt" onclick="undoWater()">↶ Undo last drink</button></p><p class="muted">The juice button is a joke: juice is logged as fluid you drank, but it subtracts 16 oz from your game score. Drinking juice does not erase water already consumed.</p></div><div class="card"><h3>Personal daily target</h3><p class="muted">The starting approximately 85 oz is an editable game target, <b>not</b> an official USAF hydration requirement. Actual fluid needs depend on body size, food, heat, humidity, sweat, exercise duration, and medical conditions.</p><label>Daily water challenge goal (oz)</label><input id="waterGoalInput" type="number" inputmode="decimal" min="17" max="200" step="1" value="${Math.round(waterGoal()/29.5735295625)}"><button class="btn" onclick="setWaterGoal()" style="margin-top:10px">Save my goal</button><div class="notice" style="margin-top:12px">During hot or long training, drink regularly and adjust to thirst and sweat losses. Avoid forcing extra water just to clear the juice penalty: overhydration can cause dangerous low blood sodium. For prolonged heavy sweating, consider appropriate electrolytes and follow unit/medical guidance. Confusion or collapse needs urgent help.</div></div><div class="card"><h3>Last 7 logged days</h3>${dates.length?dates.map(d=>`<div class="history"><b>${esc(d)}</b><span style="float:right">${oz((state.water||{})[d]||0)} oz water · ${oz((state.juice||{})[d]||0)} oz juice · ${oz(Math.max(0,Number((state.water||{})[d]||0)-Number((state.juice||{})[d]||0)))} oz game credit</span></div>`).join(''):'<p class="muted">Your first drink is waiting.</p>'}</div><p class="muted">Entries are stored on this phone until cloud sync is configured. This is a playful challenge, not a medical hydration assessment.</p>`}
let waterUndo=null;
function addWater(ml){ml=Math.round(Number(ml));if(!Number.isFinite(ml)||ml<1||ml>2000){alert('Enter an amount from 1 to 2,000 mL.');return}let d=today();state.water=state.water||{};waterUndo={date:d,type:"water",previous:waterToday()};state.water[d]=waterToday()+ml;save();queueSync();render()}
function addWaterOz(amount){addWater(Number(amount)*29.5735295625)}
function addJuiceOz(amount){let ml=Math.round(Number(amount)*29.5735295625);if(!Number.isFinite(ml)||ml<1||ml>2000)return;let d=today();state.juice=state.juice||{};waterUndo={date:d,type:"juice",previous:juiceToday()};state.juice[d]=juiceToday()+ml;save();queueSync();render();alert('JUICE?! Your girlfriend made you a whole training app and you chose the juice aisle? 😂 That is 16 oz off your WATER CHALLENGE score. The hydration department expects a comeback. (Your actual fluid intake is still recorded.)')}
function addCustomWater(){addWaterOz(el('customWater').value)}
function undoWater(){if(!waterUndo||waterUndo.date!==today()){alert('No recent water entry to undo in this session.');return}if(waterUndo.type==="juice"){state.juice=state.juice||{};state.juice[today()]=waterUndo.previous}else{state.water[today()]=waterUndo.previous}waterUndo=null;save();queueSync();render()}
function setWaterGoal(){let v=Number(el('waterGoalInput').value);if(!Number.isFinite(v)||v<17||v>200){alert('Choose a tracking goal between 17 and 200 oz. This is not a prescribed intake.');return}state.waterGoalMl=Math.round(v*29.5735295625);save();queueSync();render()}
function initCloud(){if(!state.sync.url||!state.sync.key||!window.supabase)return false;try{client=window.supabase.createClient(state.sync.url,state.sync.key);return true}catch{return false}}
async function authCloud(mode){state.sync.url=el('cloudUrl').value.trim();state.sync.key=el('cloudKey').value.trim();state.sync.email=el('cloudEmail').value.trim();save();if(!initCloud()){alert('Enter a valid Supabase URL and public key.');return}let password=el('cloudPassword').value;if(password.length<8){alert('Password must be at least 8 characters.');return}try{let r=mode==='signup'?await client.auth.signUp({email:state.sync.email,password}):await client.auth.signInWithPassword({email:state.sync.email,password});if(r.error)throw r.error;if(!r.data.session){alert('Account created. Confirm your email, then sign in.');return}sessionUser=r.data.user;cloudReady=true;await syncNow();render()}catch(e){alert(e.message)}}
async function restoreCloud(){if(!initCloud())return;try{let {data}=await client.auth.getSession();if(data.session){sessionUser=data.session.user;cloudReady=true;await syncNow();render()}}catch(e){console.warn(e)}}
function payload(){let {sync,role,tab,coachLink,...data}=state;return data}async function syncNow(){if(!client||!cloudReady||!sessionUser){alert('Sign in to cloud sync first.');return}try{if(state.role==='coach'&&state.coachLink){let {data,error}=await client.rpc('coach_read_athlete',{invite:state.coachLink});if(error)throw error;if(data){state=merge(state,data);save();render();alert('Coach dashboard updated from athlete data.');return}}let {data:remote,error:readError}=await client.from('profiles').select('data').eq('id',sessionUser.id).maybeSingle();if(readError)throw readError;if(remote?.data){let server=remote.data;let local=payload();let joined={...server,scores:dedupScores([...(server.scores||[]),...(local.scores||[])]),workouts:{...(server.workouts||{}),...(local.workouts||{})},fatigue:{...(server.fatigue||{}),...(local.fatigue||{})},water:{...(server.water||{}),...(local.water||{})}};state=merge(state,joined)}let {error}=await client.from('profiles').upsert({id:sessionUser.id,data:payload(),updated_at:new Date().toISOString()});if(error)throw error;save();render()}catch(e){alert('Sync failed: '+e.message)}}function dedupScores(xs){let m=new Map;xs.forEach(x=>m.set([x.date,x.push,x.sit,x.run,x.pacer].join('|'),x));return [...m.values()].sort((a,b)=>b.date.localeCompare(a.date))}let syncPending=false;function queueSync(){if(!cloudReady||syncPending||state.role==='coach')return;syncPending=true;setTimeout(async()=>{syncPending=false;await syncNowSilent()},1200)}async function syncNowSilent(){if(!client||!sessionUser)return;try{await client.from('profiles').upsert({id:sessionUser.id,data:payload(),updated_at:new Date().toISOString()})}catch(e){console.warn('Offline: local changes retained',e)}}
async function createInvite(){if(!cloudReady){alert('Sign in as the athlete first.');return}try{let {data,error}=await client.rpc('make_invite');if(error)throw error;el('inviteResult').textContent='Share this code with your coach: '+data}catch(e){alert(e.message)}}async function joinAthlete(){state.coachLink=el('inviteCode').value.trim().toUpperCase();save();if(!cloudReady){alert('Sign in first.');return}try{let {data,error}=await client.rpc('coach_read_athlete',{invite:state.coachLink});if(error)throw error;if(!data){alert('Code not found.');return}state=merge(state,data);save();render();alert('Athlete linked! Use Sync now to refresh.') }catch(e){alert(e.message)}}
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});render();restoreCloud();
</script></body></html>
