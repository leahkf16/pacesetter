function workout(week,idx){let id=week+'-'+idx,level=state.workouts[id]?.intensity||'light',plan=TRAINING_DAYS[idx],sets=level==='heavy'?3:2,reps=level==='light'?'6–8':level==='moderate'?'8–10':'8–12',runMinutes=level==='light'?18:level==='moderate'?26:34,duration=runMinutes+Math.min(8,Math.max(0,Math.floor((week-1)/2)*2)),reduced=status()==='taper'||(state.fatigue[(week-1)+'-'+idx]||0)>=4;let items=[],runInfo='',warmup='',cooldown=[];if(reduced)duration=Math.round(duration*.7);if(idx===0)items=[['Push-ups',sets+' × '+reps+', stop 2–3 reps before failure','75 sec'],['Dumbbell bench press',sets+' × '+reps,'75 sec'],['Single-arm dumbbell row',sets+' × '+reps+' each side','60 sec']];if(idx===2)items=[['Goblet squat',sets+' × '+reps,'75 sec'],['Romanian deadlift',sets+' × '+reps,'75 sec'],['Reverse lunge',sets+' × 6–8 each leg','60 sec']];if(idx===4)items=[['Test-form sit-ups',sets+' × 8–12','75 sec'],['Dead bugs',sets+' × 8 each side','45 sec'],['Side plank',sets+' × 20–30 sec each side','45 sec']];if(level==='heavy'){if(idx===0)items.push(['Overhead press','2 × 8','75 sec']);if(idx===2)items.push(['Calf raises','2 × 12–15','45 sec']);if(idx===4)items.push(['Bird dogs','2 × 8 each side','45 sec'])}if(reduced&&plan.kind==='strength')items=items.slice(0,2);if(plan.kind==='run'){if(level==='light')runInfo=duration+' min easy conversational run/walk. Walk breaks whenever needed.';else if(idx===1)runInfo=level==='moderate'?`~${duration} min: 8 min easy, 4 × 1 min controlled faster running with 2 min easy recovery, then easy running.`:`~${duration} min: 10 min easy, 5 × 1 min strong but controlled running with 2 min easy recovery, then easy running. Never sprint all-out.`;else if(idx===3)runInfo=level==='moderate'?`~${duration} min: 8 min easy, 10 min comfortably steady, remainder easy.`:`~${duration} min: 10 min easy, 2 × 6 min comfortably hard with 3 min easy between, then easy running.`;else runInfo=duration+' min of conversational running or run/walk.';if(reduced)runInfo='Recovery adjustment: '+runInfo+' Stay easy.';warmup='5–10 min brisk walking and easy jogging, gradually building pace.';cooldown=[['Slow walk',level==='light'?180:level==='moderate'?300:420],['Gentle calf stretch',60],['Gentle quad and hip-flexor stretch',60],['Slow breathing',60]]}else{warmup='5–8 min easy walking or marching, gentle mobility, then one light practice set.';cooldown=[['Easy walk',level==='light'?120:level==='moderate'?180:300],['Gentle mobility',level==='light'?90:120],['Slow breathing',60]]}return {...plan,id,week,idx,level,items,runInfo,warmup,cooldown,reduced}}

function workCard(wk,i){let id=wk+'-'+i,r=state.workouts[id]||{},w=workout(wk,i),checked=r.checked||{},total=w.kind==='run'?1:w.items.length,completed=Object.values(checked).filter(Boolean).length,seconds=w.cooldown.reduce((a,x)=>a+x[1],0);return `<div class="card" id="work${i}"><div class="flex"><div><span class="chip">${DAY[i]}</span><span class="chip">${w.kind==='run'?'Running only':'Strength only'}</span><h3>${esc(w.theme)}</h3></div><span class="chip">${r.done?'✓ Done':r.skipped?'↷ Skipped':completed+'/'+total}</span></div><div class="card gold" style="margin-top:12px"><b>How hard are we going today?</b><p class="muted">Changing intensity resets this session’s checkmarks.</p><div class="row">${['light','moderate','heavy'].map(x=>`<button class="btn ${w.level===x?'':'alt'}" onclick="setIntensity('${id}','${x}')">${x==='light'?'🌿 Light':x==='moderate'?'⚡ Moderate':'🔥 Heavy'}</button>`).join('')}</div><p class="muted">${w.level==='light'?'Easy · RPE 3–4/10':w.level==='moderate'?'Steady · RPE 5–6/10':'Challenging · RPE 7–8/10'}${w.reduced?' · Recovery adjustment active':''}</p></div><div class="card blue"><b>Warm-up first</b><p class="muted">${esc(w.warmup)}</p></div>${w.kind==='run'?`<div class="card blue"><b>Running session — no lifting today</b><p class="muted">${esc(w.runInfo)}</p><label class="row"><input class="check" type="checkbox" ${checked.run?'checked':''} onchange="mark('${id}','run',this.checked)"> Completed run</label></div>`:`<div class="card blue"><b>Strength session — no running today</b><p class="muted">Use controlled technique and leave reps in reserve.</p></div>${w.items.map((x,j)=>`<div class="exercise"><div class="row" style="flex-wrap:nowrap"><input class="check" type="checkbox" ${checked[j]?'checked':''} onchange="mark('${id}','${j}',this.checked)"><div style="flex:1"><b>${esc(x[0])}</b><div class="muted">${esc(x[1])} · Rest ${esc(x[2])}</div></div><button class="btn alt" onclick="startTimer(${parseInt(x[2])||60})">⏱</button></div><details>< function skipWorkout(id){let r=state.workouts[id]||{checked:{}};if(r.skipped){r.skipped=false;delete r.skipReason}else{let reason=prompt('Why skip today? Busy, sick, injured, exhausted, or other?','busy');if(reason===null)return;r.skipped=true;r.done=false;r.skipReason=reason;r.skippedAt=new Date().toISOString();alert(/sick|injur|exhaust|pain/i.test(reason)?'Recovery matters. Rest and come back when you feel better.':'Your running shoes are filing a missing-person report. Leah loves you anyway! 💚')}state.workouts[id]=r;save();queueSync();render()}
function finish(id){let r=state.workouts[id]||{checked:{}};if(!r.cooldownDone){alert('Complete your cool-down before saving.');return}r.done=true;r.skipped=false;r.finishedAt=new Date().toISOString();r.completedIntensity=r.intensity||'light';state.workouts[id]=r;save();queueSync();render()}
function startTimer(s){clearInterval(timerInterval);timerLeft=s;timerRunning=false;el('timerOverlay')?.remove();let overlay=document.createElement('div');overlay.id='timerOverlay';overlay.style='position:fixed;inset:0;background:#0c2925e8;z-index:20;display:flex;align-items:center;justify-content:center;padding:20px';overlay.innerHTML=`<div class="card" style="width:min(380px,100%);text-align:center"><div class="eyebrow" style="color:#507b61">TRAINING TIMER</div><div class="timer" id="timeDisplay">${mm(s)}</div><div class="row" style="justify-content:center"><button class="btn" id="timerToggle" onclick="toggleTimer()">Start</button><button class="btn alt" onclick="resetTimer(${s})">Reset</button><button class="btn alt" onclick="closeTimer()">Close</button></div></div>`;document.body.appendChild(overlay)}
function toggleTimer(){timerRunning=!timerRunning;el('timerToggle').textContent=timerRunning?'Pause':'Resume';clearInterval(timerInterval);if(timerRunning)timerInterval=setInterval(()=>{timerLeft=Math.max(0,timerLeft-1);if(el('timeDisplay'))el('timeDisplay').textContent=mm(timerLeft);if(!timerLeft){clearInterval(timerInterval);timerRunning=false;if(el('timerToggle'))el('timerToggle').textContent='Done ✓';if(navigator.vibrate)navigator.vibrate([150,100,150])}},1000)}
function resetTimer(s){clearInterval(timerInterval);timerLeft=s;timerRunning=false;el('timeDisplay').textContent=mm(s);el('timerToggle').textContent='Start'}
function closeTimer(){clearInterval(timerInterval);el('timerOverlay')?.remove()}
function scoresView(){return `<h2>Performance lab</h2><div class="card accent"><b>Beat the standard. Then beat your best.</b><p class="muted">Log your actual PT performance.</p><div class="formgrid"><div><label>Push-ups / 60 sec</label><input id="scorePush" type="number" min="0"></div><div><label>Sit-ups / 60 sec</label><input id="scoreSit" type="number" min="0"></div><div><label>2-mile (MM:SS)</label><input id="scoreRun" placeholder="19:15"></div><div><label>PACER shuttles</label><input id="scorePacer" type="number" min="0"></div></div><label>Test date</label><input id="scoreDate" type="date" value="${today()}"><p><button class="btn" onclick="addScore()">Save performance</button></p></div><h2>Current vs standard</h2>${readinessView(state)}<h2>Progress history</h2><div class="card">${state.scores.length?state.scores.slice(0,15).map(s=>`<div class="history"><b>${esc(s.date)}</b><div class="muted">${s.push} push-ups · ${s.sit} sit-ups · ${mm(s.run)} run · ${s.pacer} shuttles</div></div>`).join(''):'<div class="empty">No test results yet.</div>'}</div><button class="btn alt" onclick="exportCSV()">Export progress CSV ↓</button>`}
function addScore(){let prev=latest(),r=el('scoreRun').value.trim(),seconds=r?parseTime(r):prev.run;if(seconds===null||seconds<60||seconds>7200){alert('Enter a valid run time such as 18:45.');return}let s={date:el('scoreDate').value||today(),push:el('scorePush').value===''?prev.push:n(el('scorePush').value),sit:el('scoreSit').value===''?prev.sit:n(el('scoreSit').value),run:seconds,pacer:el('scorePacer').value===''?prev.pacer:n(el('scorePacer').value)};state.scores.unshift(s);state.scores.sort((a,b)=>b.date.localeCompare(a.date));save();queueSync();render()}
function exportCSV(){let rows=['date,pushups,situps,run_seconds,pacer',...state.scores.map(s=>[s.date,s.push,s.sit,s.run,s.pacer].join(','))],url=URL.createObjectURL(new Blob([rows.join('\n')],{type:'text/csv'})),a=document.createElement('a');a.href=url;a.download='pacesetter-scores.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function settingsView(){return `<h2>Make it yours</h2><div class="card"><label>Athlete name</label><input id="name" value="${esc(state.name)}"><label>USAF age bracket</label><select id="ageBand"><option value="auto" ${state.ageBand==='auto'?'selected':''}>Automatic from birthday</option>${AGE_BANDS.map(x=>`<option ${state.ageBand===x?'selected':''}>${x}</option>`).join('')}</select><label>Birthday</label><input id="birthday" type="date" value="${esc(state.birthday)}"><label>Next PT test date</label><input id="testDate" type="date" value="${esc(state.testDate)}"><label>2-mile stretch goal (MM:SS)</label><input id="runGoal" value="${mm(state.runGoal)}"><label>Current 2-mile baseline (MM:SS)</label><input id="baselineRun" value="${mm(state.baseline.run)}"><p class="muted">Starting performance values are estimates. Verify the baseline and official USAF rules.</p><button class="btn" onclick="saveSettings()">Save goals</button></div><div class="card"><h3>PT test history</h3><button class="btn alt" onclick="archiveTest()">Archive current PT test</button>${(state.testHistory||[]).map(t=>`<div class="history"><b>${esc(t.date)}</b><div class="muted">${t.push} push-ups · ${t.sit} sit-ups · ${mm(t.run)} run</div></div>`).join('')}</div>${cloudSettings()}`}
function saveSettings(){let goal=parseTime(el('runGoal').value),base=parseTime(el('baselineRun').value);if(!goal||!base){alert('Enter times as MM:SS');return}state.name=el('name').value.trim()||'Athlete';state.ageBand=el('ageBand').value;state.birthday=el('birthday').value||'1999-12-04';state.testDate=el('testDate').value;state.runGoal=goal;state.baseline.run=base;save();queueSync();render()}
function archiveTest(){if(!state.testDate){alert('Set a PT test date first.');return}if((state.testHistory||[]).some(x=>x.date===state.testDate)){alert('This test is already archived.');return}if(!confirm('Archive this PT test using your latest scores?'))return;state.testHistory=state.testHistory||[];state.testHistory.unshift({...latest(),date:state.testDate});state.testDate='';save();queueSync();render()}
function waterToday(d=state){return Math.max(0,Number(d.water?.[today()]||0))}function juiceToday(d=state){return Math.max(0,Number(d.juice?.[today()]||0))}function waterGoal(d=state){return Math.max(500,Math.min(6000,Number(d.waterGoalMl)||2500))}function challengeWater(d=state){return Math.max(0,waterToday(d)-juiceToday(d))}function waterPct(d=state){return Math.min(100,Math.round(100*challengeWater(d)/waterGoal(d)))}function oz(ml){return (Number(ml)/29.5735295625).toFixed(1)}
function waterMini(){return `<div class="card blue"><div class="flex"><div><b>💧 Today's water challenge</b><p class="muted">${oz(challengeWater())} oz credit / ${oz(waterGoal())} oz goal · ${waterPct()}%</p><p class="muted">Actually drank: ${oz(waterToday())} oz water · ${oz(juiceToday())} oz juice.</p></div><button class="btn alt" onclick="changeTab('water')">Track drinks →</button></div><div class="track"><div class="fill" style="width:${waterPct()}%"></div></div></div>`}
function waterView(){let dates=[...new Set([...Object.keys(state.water||{}),...Object.keys(state.juice||{})])].sort().reverse().slice(0,7);return `<h2>💧 Hydration station</h2><div class="hero"><div class="eyebrow">FUEL THE WORK</div><h1>${oz(challengeWater())} oz</h1><p>Water challenge credit · ${waterPct()}% of daily goal</p><p>Actual intake: ${oz(waterToday())} oz water · ${oz(juiceToday())} oz juice</p></div><div class="card"><h3>Quick add</h3><div class="formgrid"><button class="btn alt" onclick="addWaterOz(32)">💧 Everyday bottle · +32 oz</button><button class="btn alt" onclick="addWaterOz(16)">💧 Water bottle · +16 oz</button><button class="btn alt" onclick="addWaterOz(16)">🥤 Solo cup water · +16 oz</button><button class="btn alt" onclick="addJuiceOz(16)">🧃 Juice · −16 oz game credit</button></div><label>Custom water amount (oz)</label><div class="flex"><input id="customWater" type="number" min="0.5" max="67" step="0.5"><button class="btn" onclick="addCustomWater()">Add</button></div><p><button class="btn alt" onclick="undoWater()">Undo last drink</button></p><p class="muted">The juice penalty is only a game. Juice still counts as fluid consumed.</p></div><div class="card"><h3>Daily challenge goal</h3><label>Water goal (oz)</label><input id="waterGoalInput" type="number" min="17" max="200" value="${Math.round(waterGoal()/29.5735295625)}"><p><button class="btn" onclick="setWaterGoal()">Save goal</button></p><div class="notice">This is an editable game target, not a medical requirement. Avoid forcing extra water to clear the game penalty; overhydration can be dangerous.</div></div><div class="card"><h3>Last 7 logged days</h3>${dates.length?dates.map(d=>`<div class="history"><b>${esc(d)}</b><p class="muted">${oz(state.water?.[d]||0)} oz water · ${oz(state.juice?.[d]||0)} oz juice</p></div>`).join(''):'<p class="muted">No drinks logged yet.</p>'}</div>`}
function addWaterOz(amount){let ml=Math.round(Number(amount)*29.5735295625);if(!Number.isFinite(ml)||ml<1||ml>2000){alert('Invalid amount.');return}state.water=state.water||{};waterUndo={date:today(),type:'water',previous:waterToday()};state.water[today()]=waterToday()+ml;save();queueSync();render()}
function addJuiceOz(amount){let ml=Math.round(Number(amount)*29.5735295625);state.juice=state.juice||{};waterUndo={date:today(),type:'juice',previous:juiceToday()};state.juice[today()]=juiceToday()+ml;save();queueSync();render();alert('JUICE?! Your girlfriend made you a whole training app and you chose juice? 😂')}
function addCustomWater(){addWaterOz(el('customWater').value)}
function undoWater(){if(!waterUndo||waterUndo.date!==today()){alert('No recent drink to undo.');return}let bucket=waterUndo.type==='juice'?'juice':'water';state[bucket][today()]=waterUndo.previous;waterUndo=null;save();queueSync();render()}
function setWaterGoal(){let x=Number(el('waterGoalInput').value);if(!Number.isFinite(x)||x<17||x>200){alert('Choose a goal between 17 and 200 oz.');return}state.waterGoalMl=Math.round(x*29.5735295625);save();queueSync();render()}
// Supabase URL/key are built into the app. Users only need their own email/password.
function initCloud(){if(!window.supabase)return false;if(client)return true;try{client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storage:window.localStorage,storageKey:AUTH_STORAGE}});return true}catch(e){console.error(e);return false}}
function payload(){let {sync,role,tab,coachLink,coachNotes,...data}=state;return data}
function prefsKey(){return sessionUser?'pacesetter-prefs-'+sessionUser.id:null}
function saveAccountPrefs(){let k=prefsKey();if(k)localStorage.setItem(k,JSON.stringify({role:state.role,coachLink:state.coachLink,coachNotes:state.coachNotes}))}
function loadAccountPrefs(){let k=prefsKey();if(!k)return;try{let p=JSON.parse(localStorage.getItem(k)||'{}');if(p.role)state.role=p.role;if(typeof p.coachLink==='string')state.coachLink=p.coachLink;if(typeof p.coachNotes==='string')state.coachNotes=p.coachNotes}catch(e){console.warn(e)}}
function legacyAuthKey(){return 'sb-'+new URL(SUPABASE_URL).hostname.split('.')[0]+'-auth-token'}
function tryMigrateSession(){// Supabase's previous default storage key may hold an existing session.
 try{if(!localStorage.getItem(AUTH_STORAGE)){let old=localStorage.getItem(legacyAuthKey());if(old)localStorage.setItem(AUTH_STORAGE,old)}}catch(e){console.warn(e)} }
async function restoreCloud(){if(!initCloud())return;try{let {data,error}=await client.auth.getSession();if(error)throw error;if(data.session)await activateSession(data.session.user);else render()}catch(e){console.warn('Restore:',e);render()}}
async function activateSession(user){if(!user)return;let changed=sessionUser?.id!==user.id;sessionUser=user;cloudReady=true;if(changed){athleteData=null;connectedAthleteId=null;state.coachLink='';state.coachNotes='';loadAccountPrefs()}state.sync.email=user.email||'';save();if(state.role==='coach'){await loadCoachProfile();await refreshCoach()}else await loadAthleteProfile();await loadLoveNotes();render()}
async function authCloud(mode){let email=el('cloudEmail').value.trim(),password=el('cloudPassword').value;if(!email||password.length<8){alert('Enter your email and a password of at least 8 characters.');return}if(!initCloud()){alert('Cloud library could not load. Check your connection.');return}try{let r=mode==='signup'?await client.auth.signUp({email,password}):await client.auth.signInWithPassword({email,password});if(r.error)throw r.error;if(!r.data.session){alert('Check your email for confirmation, then sign in.');return}await activateSession(r.data.user);alert('Signed in successfully!')}catch(e){alert('Sign-in failed: '+e.message)}}
async function signOutCloud(){if(!client)return;try{saveAccountPrefs();await client.auth.signOut();sessionUser=null;cloudReady=false;athleteData=null;connectedAthleteId=null;loveNotes=[];loveError='';render();alert('Signed out.')}catch(e){alert(e.message)}}
async function loadAthleteProfile(){if(!client||!sessionUser)return;let {data,error}=await client.from('profiles').select('data').eq('id',sessionUser.id).maybeSingle();if(error)throw error;if(data?.data){let keep={sync:state.sync,role:state.role,tab:state.tab,coachLink:state.coachLink,coachNotes:state.coachNotes};state=merge(fresh(),data.data);Object.assign(state,keep);save()}}
async function saveAthleteProfile(){if(!client||!sessionUser||state.role!=='athlete')return;let {error}=await client.from('profiles').upsert({id:sessionUser.id,data:payload(),updated_at:new Date().toISOString()});if(error)throw error}

async function syncNow(){if(!cloudReady||!sessionUser){alert('Sign in first.');return}try{if(state.role==='coach'){await refreshCoach();await loadLoveNotes();render();alert(athleteData?'Coach dashboard updated.':'No athlete data could be loaded. Check the connection in Settings.')}else{await saveAthleteProfile();alert('Athlete progress saved to cloud.')}}catch(e){alert('Sync failed: '+e.message)}}
async function createInvite(){if(!cloudReady||!sessionUser){alert('Sign in as the athlete first.');return}try{let {data,error}=await client.rpc('make_invite');if(error)throw error;el('inviteResult').textContent='Share this code with your coach: '+data}catch(e){alert('Invite failed: '+e.message)}}
async function joinAthlete(){if(!cloudReady||!sessionUser){alert('Sign in to your Coach account first.');return}let code=el('inviteCode').value.trim().toUpperCase();if(!/^[A-Z0-9]{6}$/.test(code)){alert('Enter the six-character invitation code.');return}try{let {error:joinError}=await client.rpc('join_invite',{invite_code:code});if(joinError)throw joinError;let {data,error}=await client.rpc('coach_read_athlete',{invite:code});if(error)throw error;state.coachLink=code;athleteData=data?merge(fresh(),data):null;saveAccountPrefs();save();await loadLoveNotes();render();alert('Athlete connected successfully!')}catch(e){alert('Could not link athlete: '+e.message)}}
async function refreshCoach(){if(!client||!sessionUser)return;athleteData=null;connectedAthleteId=null;let {data:links,error:linkError}=await client.from('pacesetter_coach_access').select('athlete_id').eq('coach_id',sessionUser.id).limit(1);if(linkError)console.warn('Coach access lookup:',linkError);let athleteId=links?.[0]?.athlete_id||null;if(!athleteId&&state.coachLink){let {data:invite}=await client.from('pacesetter_invites').select('athlete_id').eq('code',state.coachLink).maybeSingle();athleteId=invite?.athlete_id||null;}connectedAthleteId=athleteId;if(athleteId){let {data:profile,error:profileError}=await client.from('profiles').select('data').eq('id',athleteId).maybeSingle();if(!profileError&&profile?.data){athleteData=merge(fresh(),profile.data);return}if(profileError)console.warn('Athlete profile RLS:',profileError)}if(state.coachLink){let {data,error}=await client.rpc('coach_read_athlete',{invite:state.coachLink});if(!error&&data){athleteData=merge(fresh(),data);return}if(error)console.warn('Coach RPC:',error)}}
async function loadCoachProfile(){if(!client||!sessionUser)return;let {data,error}=await client.from('profiles').select('data').eq('id',sessionUser.id).maybeSingle();if(error){console.warn('Coach notes:',error);return}if(typeof data?.data?.coachNotes==='string')state.coachNotes=data.data.coachNotes;saveAccountPrefs();save()}
async function saveCoachNote(){let note=el('coachNotes').value;state.coachNotes=note;saveAccountPrefs();save();if(!cloudReady||!sessionUser){alert('Note saved on this device. Sign in to save it to your account.');return}try{let {data,error:readError}=await client.from('profiles').select('data').eq('id',sessionUser.id).maybeSingle();if(readError)throw readError;let ownData=data?.data||{};let {error}=await client.from('profiles').upsert({id:sessionUser.id,data:{...ownData,coachNotes:note,coachName:state.coachName},updated_at:new Date().toISOString()});if(error)throw error;render();alert('Coach note saved to your account!')}catch(e){alert('Saved locally, but cloud save failed: '+e.message)}}
function coachNoteView(){return `<h2>Coach's Notes</h2><div class="card"><label>Encouragement or training guidance</label><textarea id="coachNotes" placeholder="Keep your easy runs easy!">${esc(state.coachNotes)}</textarea><p><button class="btn" onclick="saveCoachNote()">Save coach note</button></p><p class="muted">Saved to your Coach account, separately from athlete workout data.</p></div>`}
function coachView(){if(state.tab==='settings')return coachSettings();let d=athleteData;if(!d)return `${loveNotesView()}${motivationCard()}<div class="hero"><div class="eyebrow">YOUR COACH CORNER</div><h1>Lead the progress.<br>Celebrate the wins.</h1><p>${cloudReady?'Signed in to your Coach account.':'Sign in to connect your athlete.'}</p><button class="btn goldbtn" onclick="changeTab('settings')">Manage athlete connection →</button></div><div class="card gold"><h3>No athlete data loaded yet</h3><p class="muted">If already linked, tap Sync now. Otherwise enter his invitation code in Settings.</p><button class="btn" onclick="syncNow()">Sync now</button></div>${coachNoteView()}`;let done=Object.values(d.workouts||{}).filter(x=>x.done).length,left=daysLeft(d);return `${birthdayCard(d)}${loveNotesView()}${motivationCard()}<div class="hero"><div class="eyebrow">YOUR COACH CORNER</div><h1>Lead the progress.<br>Celebrate the wins.</h1><p>Training dashboard for ${esc(d.name||'your athlete')}.</p><button class="btn goldbtn" onclick="syncNow()">Refresh athlete progress →</button></div><div class="metricgrid">${metric('SESSIONS DONE',done,'recorded workouts')}${metric('RUN TIME',mm(latest(d).run),'2 miles')}${metric('TEST IN',left===null?'—':Math.max(0,left),'days')}${metric('WEEK',trainingWeek(d),status(d)+' phase')}</div><h2>Readiness snapshot</h2>${readinessView(d)}<h2>Hydration</h2><div class="card blue"><b>💧 Athlete hydration</b><p class="muted">${oz(waterToday(d))} oz water · ${oz(juiceToday(d))} oz juice</p></div><h2>Recent training</h2><div class="card">${Object.entries(d.workouts||{}).filter(([k,v])=>v.done).sort((a,b)=>(b[1].finishedAt||'').localeCompare(a[1].finishedAt||'')).slice(0,8).map(([k,v])=>`<div class="history"><b>Week ${esc(k.split('-')[0])} · ${esc(DAY[Number(k.split('-')[1])]||'Workout')}</b><div class="muted">Completed ${esc((v.finishedAt||'').slice(0,10))} · ${esc(v.completedIntensity||v.intensity||'light')} intensity · Cool-down ${v.cooldownDone?'✓':'not recorded'} · Fatigue ${d.fatigue?.[k]||'not recorded'}/5</div></div>`).join('')||'<p class="muted">No completed workouts yet.</p>'}</div>${coachNoteView()}${syncNotice()}`}

function lovePartnerId(){return state.role==='coach'?connectedAthleteId:sessionUser?.id}
function loveNotesView(){
 const signed=!!(cloudReady&&sessionUser),isCoach=state.role==='coach',unread=loveNotes.filter(m=>m.recipient_id===sessionUser?.id&&!m.read_at).length;

 ${loveNotes.length>3?`<button class="btn alt" style="margin-top:10px" onclick="loveExpanded=!loveExpanded;render()">${loveExpanded?'Show less':'View all '+loveNotes.length+' messages'}</button>`:''}
 </div>`;

async function loadLoveNotes(){
 if(!client||!sessionUser){loveNotes=[];return}
 const athleteId=lovePartnerId();if(!athleteId){loveNotes=[];return}
 try{
  let q=client.from('pacesetter_love_notes').select('id,athlete_id,sender_id,recipient_id,body,created_at,read_at').eq('athlete_id',athleteId).order('created_at',{ascending:false}).limit(100);
  const {data,error}=await q;if(error)throw error;
  loveNotes=data||[];loveError='';
  const unread=loveNotes.filter(m=>m.recipient_id===sessionUser.id&&!m.read_at).map(m=>m.id);
  if(unread.length){const {error:markError}=await client.from('pacesetter_love_notes').update({read_at:new Date().toISOString()}).in('id',unread).eq('recipient_id',sessionUser.id);if(markError)console.warn('Love Notes read receipt:',markError)}
 }catch(e){loveError='Love Notes need setup in Supabase, or the connection could not be loaded: '+e.message;console.warn(e)}
}
async function sendLoveNote(message){
 if(loveBusy||!cloudReady||!sessionUser){alert('Please sign in first.');return}
 const athleteId=lovePartnerId();if(!athleteId){alert('Connect the Athlete account first.');return}
 const body=String(message??el('loveMessage')?.value??'').trim();if(!body||body.length>1500){alert('Write a message of up to 1,500 characters.');return}
 loveBusy=true;
 try{
  if(state.role==='coach'){
   const {error}=await client.from('pacesetter_love_notes').insert({athlete_id:athleteId,sender_id:sessionUser.id,recipient_id:athleteId,body});if(error)throw error;
  }else{
   const {data:links,error:lookupError}=await client.from('pacesetter_coach_access').select('coach_id').eq('athlete_id',sessionUser.id).limit(1);
   if(lookupError)throw lookupError;
   const coachId=links?.[0]?.coach_id;if(!coachId)throw Error('No coach is linked to your account yet.');
   const {error}=await client.from('pacesetter_love_notes').insert({athlete_id:sessionUser.id,sender_id:sessionUser.id,recipient_id:coachId,body});if(error)throw error;
  }
  await loadLoveNotes();render();
 }catch(e){alert('Could not send Love Note: '+e.message)}finally{loveBusy=false}
}
function sendQuickLove(){return sendLoveNote(state.role==='coach'?'Sending you all my love ❤️':'Sending you love back, baby ❤️')}
// Check for new messages when the app returns to the foreground.
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&cloudReady)loadLoveNotes().then(render).catch(console.warn)});

// Startup: migrate existing Supabase v2 browser session if possible.
tryMigrateSession();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(console.warn);
render();restoreCloud();
</script></body></html>
